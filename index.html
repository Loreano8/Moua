<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <script src="assets/vendor/gsap.min.js"></script>
    <style>
      :root {
        --bg: #0f0d0a;
        --fg: #f4efe4;
        --accent: #f2b632;
        --muted: #c9c1b2;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
      }
      #root {
        position: relative;
        width: 100%;
        height: 100%;
        overflow: hidden;
        background: var(--bg);
        color: var(--fg);
        font-family: "Archivo Black", sans-serif;
      }

      /* ---------- Footage ---------- */
      #cam {
        position: absolute;
        inset: 0;
        transform-origin: 50% 32%;
        will-change: transform;
      }
      #desk {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        object-fit: cover;
      }
      #scrim {
        position: absolute;
        inset: 0;
        background:
          linear-gradient(to top, rgba(15, 13, 10, 0.92) 0%, rgba(15, 13, 10, 0.78) 30%, rgba(15, 13, 10, 0) 58%),
          linear-gradient(to bottom, rgba(15, 13, 10, 0.55) 0%, rgba(15, 13, 10, 0) 16%);
      }

      /* ---------- Top label ---------- */
      #tag {
        position: absolute;
        top: 170px;
        left: 90px;
        right: 90px;
        display: flex;
        align-items: center;
        gap: 28px;
        font-family: "JetBrains Mono", monospace;
        font-weight: 700;
        font-size: 30px;
        letter-spacing: 0.18em;
        color: var(--fg);
      }
      #tag-dot {
        width: 18px;
        height: 18px;
        border-radius: 50%;
        background: var(--accent);
        flex: none;
      }
      #tag-rule {
        display: block;
        flex: 1;
        height: 3px;
        background: var(--accent);
        transform-origin: 0% 50%;
      }

    </style>
  </head>
  <body>
    <div
      id="root"
      data-composition-id="main"
      data-start="0"
      data-duration="8.5"
      data-width="1080"
      data-height="1920"
    >
      <!-- Footage: 7 s at 0.85x (5.95 s of the 6.05 s source) with a slow push-in -->
      <div id="cam">
        <video
          id="desk"
          class="clip"
          src="assets/video/desk.mp4"
          data-start="0"
          data-duration="7"
          data-playback-rate="0.85"
          data-track-index="0"
          muted
          playsinline
        ></video>
      </div>
      <div id="scrim" class="clip" data-start="0" data-duration="7" data-track-index="1"></div>

      <div id="tag" class="clip" data-start="0" data-duration="6.6" data-track-index="2">
        <span id="tag-dot"></span>
        <span id="tag-text">MOUA · APP</span>
        <span id="tag-rule"></span>
      </div>

      <div
        id="beat-a"
        data-composition-id="beat-a"
        data-composition-src="compositions/beat-a.html"
        data-start="0.5"
        data-duration="2"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="beat-b"
        data-composition-id="beat-b"
        data-composition-src="compositions/beat-b.html"
        data-start="2.5"
        data-duration="2"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="beat-c"
        data-composition-id="beat-c"
        data-composition-src="compositions/beat-c.html"
        data-start="4.5"
        data-duration="2.1"
        data-track-index="3"
        data-width="1080"
        data-height="1920"
      ></div>
      <div
        id="end-card"
        data-composition-id="end-card"
        data-composition-src="compositions/end-card.html"
        data-start="6.3"
        data-duration="2.2"
        data-track-index="4"
        data-width="1080"
        data-height="1920"
      ></div>

      <audio
        id="bgm"
        src="assets/audio/bgm.m4a"
        data-start="0"
        data-duration="8.5"
        data-track-index="10"
        data-volume="0.9"
      ></audio>
    </div>
    <script>
      const tl = gsap.timeline({ paused: true });
      // Footage: slow push-in across its 7 s window
      tl.fromTo("#cam", { scale: 1 }, { scale: 1.1, duration: 7, ease: "none" }, 0);

      // Top label
      tl.fromTo("#tag-dot", { scale: 0 }, { scale: 1, duration: 0.35, ease: "power3.out" }, 0.15);
      tl.fromTo("#tag-text", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.4, ease: "expo.out" }, 0.22);
      tl.fromTo("#tag-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.7, ease: "power2.out" }, 0.3);

      window.__timelines["main"] = tl;
    </script>
  </body>
</html>
