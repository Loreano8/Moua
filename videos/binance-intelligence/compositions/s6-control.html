<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #f0b90b; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }

        #s6-art { position: absolute; left: 190px; top: 90px; width: 700px; height: 700px; opacity: 0; will-change: transform; }
        #s6-img { display: block; width: 100%; height: 100%; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%); mask-image: radial-gradient(circle at 50% 50%, #000 52%, transparent 71%); }
        #s6-label { position: absolute; left: 90px; top: 830px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #0c0b09; opacity: 0; }
        #s6-ttl { position: absolute; left: 90px; right: 90px; top: 890px; font-family: "Archivo Black", sans-serif; font-size: 132px; line-height: 1.0; letter-spacing: -0.045em; color: #0c0b09; }
        #s6-ttl .ln { display: block; white-space: nowrap; }
        .chk { position: absolute; left: 90px; right: 90px; height: 100px; display: flex; align-items: center; gap: 34px; opacity: 0; will-change: transform; }
        #s6-k0 { top: 1200px; }
        #s6-k1 { top: 1320px; }
        #s6-k2 { top: 1440px; }
        #s6-k3 { top: 1560px; }
        .box { flex: none; width: 84px; height: 84px; border-radius: 20px; background: #0c0b09; color: #f0b90b; font-family: "Archivo Black", sans-serif; font-size: 54px; display: flex; align-items: center; justify-content: center; }
        .kt { font-family: "Archivo Black", sans-serif; font-size: 58px; letter-spacing: -0.03em; color: #0c0b09; white-space: nowrap; }
      </style>
      <div id="root" data-composition-id="s6-control" data-start="0" data-duration="2.6" data-width="1080" data-height="1920">
        <div id="s6-art"><img id="s6-img" src="assets/img/i4-control.jpg" alt="A hand holding a golden key in front of a black shield with a golden checkmark" /></div>
        <div id="s6-label">ALL THREE PRODUCTS</div>
        <div id="s6-ttl">
          <span class="ln" id="s6-l1"><span class="w">You</span> <span class="w">stay</span></span>
          <span class="ln" id="s6-l2"><span class="w">in</span> <span class="w">control.</span></span>
        </div>
        <div class="chk" id="s6-k0"><div class="box">✓</div><div class="kt">Permissions you set</div></div>
        <div class="chk" id="s6-k1"><div class="box">✓</div><div class="kt">Funding limits</div></div>
        <div class="chk" id="s6-k2"><div class="box">✓</div><div class="kt">Isolated sub-accounts</div></div>
        <div class="chk" id="s6-k3"><div class="box">✓</div><div class="kt">Revoke anytime</div></div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          // Key and shield slam in on "And with all three"
          tl.fromTo("#s6-art", { opacity: 0, scale: 1.6, rotation: 10 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.35, ease: "power4.in" }, 0.05);
          tl.fromTo("#s6-art", { x: 0 }, { x: 10, duration: 0.05, ease: "none", yoyo: true, repeat: 3, immediateRender: false }, 0.4);
          tl.to("#s6-art", { scale: 1.05, duration: 2.1, ease: "sine.out" }, 0.5);
          tl.fromTo("#s6-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.3);
          waterfall("#s6-l1", 1.05, 0.15);
          waterfall("#s6-l2", 1.35, 0.15);
          ["#s6-k0", "#s6-k1", "#s6-k2", "#s6-k3"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -120 }, { opacity: 1, x: 0, duration: 0.25, ease: "back.out(1.8)" }, 1.55 + 0.14 * i);
          });
          tl.to("#s6-art, #s6-ttl, #s6-label, #s6-k0, #s6-k1, #s6-k2, #s6-k3", { opacity: 0, y: -40, duration: 0.18, ease: "power3.in" }, 2.4);
          window.__timelines["s6-control"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
