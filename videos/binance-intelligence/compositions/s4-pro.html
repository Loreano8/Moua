<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }
        .grid { position: absolute; inset: -120px; background-image: linear-gradient(rgba(240, 185, 11, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(240, 185, 11, 0.07) 2px, transparent 2px); background-size: 120px 120px; }
        .spark { position: absolute; width: 14px; height: 14px; border-radius: 50%; background: #f0b90b; box-shadow: 0 0 18px 4px rgba(240,185,11,0.7); opacity: 0; }

        #s4-glow { position: absolute; left: 90px; top: 200px; width: 900px; height: 900px; border-radius: 50%; background: radial-gradient(circle, rgba(240,185,11,0.32) 0%, rgba(240,185,11,0) 65%); opacity: 0; }
        #s4-art { position: absolute; left: 90px; top: 180px; width: 900px; height: 900px; opacity: 0; transform-origin: 50% 50%; will-change: transform; }
        #s4-img { display: block; width: 100%; height: 100%; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 50%, transparent 70%); mask-image: radial-gradient(circle at 50% 50%, #000 50%, transparent 70%); }
        #s4-intro { position: absolute; left: 80px; right: 80px; top: 1180px; }
        #s4-num { opacity: 0; }
        #s4-name { margin-top: 24px; font-family: "Archivo Black", sans-serif; font-size: 150px; line-height: 1; letter-spacing: -0.045em; color: #f5f1e6; white-space: nowrap; }
        #s4-tag { margin-top: 30px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 40px; color: #f0b90b; opacity: 0; }

        #s4-label { position: absolute; left: 90px; top: 240px; opacity: 0; }
        #s4-ttl { position: absolute; left: 90px; right: 90px; top: 300px; font-family: "Archivo Black", sans-serif; font-size: 108px; line-height: 1.02; letter-spacing: -0.04em; color: #f5f1e6; }
        #s4-ttl .ln { display: block; white-space: nowrap; }
        #s4-box { position: absolute; left: 80px; right: 80px; top: 640px; height: 200px; padding: 0 48px; border-radius: 28px; border: 4px solid #f0b90b; background: #17150f; display: flex; align-items: center; opacity: 0; }
        #s4-prompt { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 50px; color: #f5f1e6; white-space: nowrap; }
        #s4-prompt .k { opacity: 0; }
        #s4-caret { display: inline-block; width: 26px; height: 60px; margin-left: 8px; background: #f0b90b; vertical-align: middle; }
        .step { position: absolute; left: 80px; right: 80px; height: 140px; padding: 0 44px; border-radius: 24px; background: #f4ecd8; display: flex; align-items: center; gap: 36px; opacity: 0; will-change: transform; }
        #s4-s0 { top: 900px; }
        #s4-s1 { top: 1060px; }
        #s4-s2 { top: 1220px; }
        #s4-s3 { top: 1380px; }
        .dot { flex: none; width: 64px; height: 64px; border-radius: 50%; background: #0c0b09; color: #f0b90b; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; display: flex; align-items: center; justify-content: center; }
        .st { font-family: "Archivo Black", sans-serif; font-size: 50px; letter-spacing: -0.02em; color: #1a1712; white-space: nowrap; }
        #s4-s2 { background: #f0b90b; }
        #s4-foot { position: absolute; left: 90px; right: 90px; top: 1580px; font-family: "JetBrains Mono", monospace; font-size: 32px; line-height: 1.4; color: #cfc8b8; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s4-pro" data-start="0" data-duration="8.3" data-width="1080" data-height="1920">
        <div id="s4-grid" class="grid" data-layout-allow-overflow></div>
        <div id="s4-glow" data-layout-allow-overflow></div>
        <div id="s4-art" data-layout-allow-overlap><img id="s4-img" src="assets/img/i2-laptop.jpg" alt="A laptop with a golden holographic workflow rising from its screen" /></div>
        <div class="spark" style="left: 190px; top: 990px"></div>
        <div class="spark" style="left: 330px; top: 1070px"></div>
        <div class="spark" style="left: 500px; top: 1000px"></div>
        <div class="spark" style="left: 660px; top: 1080px"></div>
        <div class="spark" style="left: 810px; top: 1000px"></div>
        <div class="spark" style="left: 920px; top: 1060px"></div>
        <div id="s4-intro">
          <div id="s4-num" class="label">02 · BINANCE AI PRO</div>
          <div id="s4-name"><span class="w">AI</span> <span class="w y">Pro</span></div>
          <div id="s4-tag">Your no-code trading workbench</div>
        </div>

        <div id="s4-label" class="label">02 · BINANCE AI PRO</div>
        <div id="s4-ttl">
          <span class="ln" id="s4-l1"><span class="w">Type</span> <span class="w">an</span> <span class="w">idea.</span></span>
          <span class="ln" id="s4-l2"><span class="w y">Get</span> <span class="w y">a</span> <span class="w y">workflow.</span></span>
        </div>
        <div id="s4-box"><div id="s4-prompt"><span class="k">&gt;</span><span class="k">&nbsp;</span><span class="k">D</span><span class="k">C</span><span class="k">A</span><span class="k">&nbsp;</span><span class="k">p</span><span class="k">l</span><span class="k">a</span><span class="k">n</span><span class="k">&nbsp;</span><span class="k">f</span><span class="k">o</span><span class="k">r</span><span class="k">&nbsp;</span><span class="k">B</span><span class="k">i</span><span class="k">t</span><span class="k">c</span><span class="k">o</span><span class="k">i</span><span class="k">n</span><span id="s4-caret"></span></div></div>
        <div class="step" id="s4-s0"><div class="dot">1</div><div class="st">AI plans the strategy</div></div>
        <div class="step" id="s4-s1"><div class="dot">2</div><div class="st">Paper trade it first</div></div>
        <div class="step" id="s4-s2"><div class="dot">3</div><div class="st">You approve</div></div>
        <div class="step" id="s4-s3"><div class="dot">4</div><div class="st">Runs in a sub-account</div></div>
        <div id="s4-foot">No code. Free Standard plan · Premium 19.99 USDC/mo</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s4-grid", { y: 0 }, { y: -180, duration: 8.3, ease: "none" }, 0);
          // Reveal: the workbench arrives while the voice says "AI Pro turns a trading idea"
          tl.fromTo("#s4-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.1, duration: 1.0, ease: "power2.out" }, 0);
          tl.fromTo("#s4-art", { opacity: 0, scale: 0.6, rotation: -8, y: 80 }, { opacity: 1, scale: 1, rotation: 0, y: 0, duration: 0.7, ease: "back.out(1.5)" }, 0);
          tl.to("#s4-art", { y: -24, duration: 1.0, ease: "sine.inOut" }, 0.7);
          gsap.utils.toArray("#root .spark").forEach((el, i) => {
            tl.fromTo(el, { opacity: 0, y: 0, scale: 0.4 }, { opacity: 1, y: -260 - 40 * (i % 3), scale: 1, duration: 1.0, ease: "power1.out" }, 0.25 + 0.1 * i);
            tl.to(el, { opacity: 0, duration: 0.3, ease: "power1.in" }, 1.0 + 0.1 * i);
          });
          tl.fromTo("#s4-num", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.2);
          waterfall("#s4-name", 0.3, 0.15);
          tl.fromTo("#s4-tag", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 0.8);
          // Transition: the workbench sinks into a dim backdrop behind the steps
          tl.to("#s4-intro", { opacity: 0, y: -60, duration: 0.25, ease: "power3.in" }, 1.8);
          tl.to("#s4-art", { opacity: 0.16, scale: 1.45, y: 560, duration: 0.6, ease: "expo.inOut" }, 1.85);
          tl.to("#s4-glow", { opacity: 0.25, scale: 1.4, y: 560, duration: 0.6, ease: "expo.inOut" }, 1.85);
          tl.to("#s4-art", { scale: 1.55, duration: 5.8, ease: "none" }, 2.45);
          // Info, synced to "in plain words, into an automated workflow. You test it first ... approve it."
          tl.fromTo("#s4-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 2.0);
          waterfall("#s4-l1", 2.05, 0.25);
          tl.fromTo("#s4-box", { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 2.2);
          gsap.utils.toArray("#s4-prompt .k").forEach((el, i) => {
            tl.set(el, { opacity: 1 }, 2.35 + i * 0.04);
          });
          tl.fromTo("#s4-caret", { opacity: 1 }, { opacity: 0, duration: 0.2, ease: "steps(1)", repeat: 9, yoyo: true }, 2.35);
          waterfall("#s4-l2", 3.7, 0.25);
          [["#s4-s0", 4.2], ["#s4-s1", 5.35], ["#s4-s2", 7.25], ["#s4-s3", 7.7]].forEach(([id, t]) => {
            tl.fromTo(id, { opacity: 0, x: -160 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, t);
          });
          tl.fromTo("#s4-s2", { scale: 1 }, { scale: 1.04, duration: 0.15, ease: "power2.out", yoyo: true, repeat: 1, immediateRender: false }, 7.6);
          tl.fromTo("#s4-foot", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 6.0);
          tl.to("#s4-ttl, #s4-label, #s4-box, #s4-s0, #s4-s1, #s4-s2, #s4-s3, #s4-foot, #s4-art, #s4-glow", { opacity: 0, duration: 0.2, ease: "power3.in" }, 8.08);
          window.__timelines["s4-pro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
