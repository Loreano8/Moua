<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }
        .grid { position: absolute; inset: -120px; background-image: linear-gradient(rgba(240, 185, 11, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(240, 185, 11, 0.07) 2px, transparent 2px); background-size: 120px 120px; }
        #s3-label { position: absolute; left: 80px; top: 140px; opacity: 0; }
        #s3-ttl { position: absolute; left: 80px; right: 80px; top: 190px; font-family: "Archivo Black", sans-serif; font-size: 104px; line-height: 1.0; letter-spacing: -0.045em; color: #f5f1e6; }
        #s3-glow { position: absolute; left: 240px; top: 240px; width: 600px; height: 600px; border-radius: 50%; background: radial-gradient(circle, rgba(240,185,11,0.3) 0%, rgba(240,185,11,0) 65%); opacity: 0; }
        #s3-art { position: absolute; left: 300px; top: 300px; width: 480px; height: 480px; opacity: 0; will-change: transform; }
        #s3-img { display: block; width: 100%; height: 100%; -webkit-mask-image: radial-gradient(circle at 50% 50%, #000 50%, transparent 70%); mask-image: radial-gradient(circle at 50% 50%, #000 50%, transparent 70%); }
        .row { position: absolute; left: 70px; right: 70px; height: 150px; padding: 0 36px; border-radius: 26px; background: #1c1a15; border: 3px solid #2e2b24; display: flex; align-items: center; gap: 30px; opacity: 0; will-change: transform; }
        .num { flex: none; width: 68px; height: 68px; border-radius: 50%; background: #f0b90b; color: #0c0b09; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 34px; display: flex; align-items: center; justify-content: center; }
        .rt { flex: 1; font-family: "Archivo Black", sans-serif; font-size: 46px; letter-spacing: -0.02em; color: #f5f1e6; white-space: nowrap; }
        .rv { font-family: "Archivo Black", sans-serif; font-size: 64px; letter-spacing: -0.03em; white-space: nowrap; opacity: 0; will-change: transform; }
        #s3-note { position: absolute; left: 80px; right: 80px; top: 1370px; font-family: "JetBrains Mono", monospace; font-size: 30px; line-height: 1.45; color: #cfc8b8; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s3-cc" data-start="0" data-duration="7.6" data-width="1080" data-height="1920">
        <div id="s3-grid" class="grid" data-layout-allow-overflow></div>
        <div id="s3-label" class="label">STRATEGY 1</div>
        <div id="s3-ttl"><span class="w">Covered</span> <span class="w y">Call</span></div>
        <div id="s3-glow"></div>
        <div id="s3-art"><img id="s3-img" src="assets/img/i-shares.jpg" alt="A stack of golden share certificates locked with a padlock" /></div>
        <div class="row" id="s3-r0" style="top:840px"><div class="num">1</div><div class="rt">You own the stock</div><div class="rv" id="s3-v0" style="color:#f5f1e6">$100</div></div>
        <div class="row" id="s3-r1" style="top:1010px"><div class="num">2</div><div class="rt">You sell a call at</div><div class="rv" id="s3-v1" style="color:#f0b90b">$110</div></div>
        <div class="row" id="s3-r2" style="top:1180px"><div class="num">3</div><div class="rt">You collect a premium</div><div class="rv" id="s3-v2" style="color:#3ddc84">+$3</div></div>
        <div id="s3-note">Your shares stay set aside as collateral until the option closes, expires or is assigned.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }
          tl.fromTo("#s3-grid", { y: 0 }, { y: -140, duration: 7.6, ease: "none" }, 0);
          tl.fromTo("#s3-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.15);
          waterfall("#s3-ttl", 0.45, 0.2);
          tl.fromTo("#s3-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.1, duration: 1, ease: "power2.out" }, 0.3);
          tl.fromTo("#s3-art", { opacity: 0, scale: 0.6, rotation: -8 }, { opacity: 1, scale: 1, rotation: 0, duration: 0.7, ease: "back.out(1.5)" }, 0.35);
          tl.to("#s3-art", { y: -18, duration: 6.3, ease: "sine.inOut" }, 1.05);
          tl.fromTo("#s3-r0", { opacity: 0, x: -140 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 3.0);
          tl.fromTo("#s3-v0", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 3.14);
          tl.fromTo("#s3-r1", { opacity: 0, x: -140 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 4.3);
          tl.fromTo("#s3-v1", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 5.17);
          tl.fromTo("#s3-r2", { opacity: 0, x: -140 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 6.1);
          tl.fromTo("#s3-v2", { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.4)" }, 6.78);
          tl.fromTo("#s3-note", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 6.95);
          tl.to("#s3-ttl, #s3-label, #s3-art, #s3-glow, .row, #s3-note", { opacity: 0, y: -40, duration: 0.18, ease: "power3.in" }, 7.4);
          window.__timelines["s3-cc"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
