<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        #s7-cam { position: absolute; inset: 0; transform-origin: 50% 40%; will-change: transform; }
        #s7-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s7-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(12,11,9,0.97) 0%, rgba(12,11,9,0.9) 45%, rgba(12,11,9,0) 66%); }
        #s7-risk { position: absolute; left: 80px; top: 1010px; padding: 12px 24px; border-radius: 12px; background: #ff6b5a; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.08em; color: #0c0b09; opacity: 0; }
        #s7-text { position: absolute; left: 80px; right: 60px; top: 1100px; font-family: "Archivo Black", sans-serif; font-size: 112px; line-height: 1.0; letter-spacing: -0.04em; color: #f5f1e6; }
        #s7-text .ln { display: block; white-space: nowrap; }
        #s7-card { position: absolute; left: 80px; right: 80px; top: 1360px; padding: 30px 40px; border-radius: 28px; background: #f0b90b; opacity: 0; will-change: transform; }
        #s7-ct { font-family: "Archivo Black", sans-serif; font-size: 44px; line-height: 1.12; letter-spacing: -0.02em; color: #0c0b09; }
        #s7-url { margin-top: 12px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; color: #0c0b09; }
        #s7-foot { position: absolute; left: 80px; right: 80px; top: 1680px; font-family: "JetBrains Mono", monospace; font-size: 30px; color: #cfc8b8; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s7-outro" data-start="0" data-duration="6.1" data-width="1080" data-height="1920">
        <div id="s7-cam" data-layout-allow-overflow>
          <video id="s7-video" class="clip" src="assets/video/pc.mp4" data-start="0" data-duration="6.1" data-media-start="3.9" data-playback-rate="0.65" data-track-index="0" muted playsinline></video>
        </div>
        <div id="s7-scrim"></div>
        <div id="s7-risk">HIGH RISK · NOT FINANCIAL ADVICE</div>
        <div id="s7-text">
          <span class="ln" id="s7-l1"><span class="w">Read</span> <span class="w">the</span></span>
          <span class="ln" id="s7-l2"><span class="w y">full</span> <span class="w y">guide.</span></span>
        </div>
        <div id="s7-card">
          <div id="s7-ct">Covered Call and Cash-Secured Put Are Now Live on Binance Stock Options</div>
          <div id="s7-url">binance.com/en/blog · Oct 27, 2026</div>
        </div>
        <div id="s7-foot">Link in the post ↓</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }
          tl.fromTo("#s7-cam", { scale: 1.02 }, { scale: 1.1, duration: 6.1, ease: "none" }, 0);
          tl.fromTo("#s7-risk", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.25);
          waterfall("#s7-l1", 1.35, 0.15);
          waterfall("#s7-l2", 1.65, 0.15);
          tl.fromTo("#s7-card", { opacity: 0, y: 60, scale: 0.94 }, { opacity: 1, y: 0, scale: 1, duration: 0.45, ease: "back.out(1.6)" }, 2.6);
          tl.fromTo("#s7-card", { boxShadow: "0 0 0 0 rgba(240,185,11,0.6)" }, { boxShadow: "0 0 0 26px rgba(240,185,11,0)", duration: 0.9, ease: "power2.out", repeat: 2, immediateRender: false }, 3.1);
          tl.fromTo("#s7-foot", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 3.0);
          window.__timelines["s7-outro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
