<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .y { color: #f0b90b; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.16em; color: #f0b90b; }
        #s4-label { position: absolute; left: 80px; top: 150px; opacity: 0; }
        #s4-ttl { position: absolute; left: 80px; right: 80px; top: 200px; font-family: "Archivo Black", sans-serif; font-size: 100px; line-height: 1.0; letter-spacing: -0.045em; color: #f5f1e6; }
        #s4-chart { position: absolute; left: 50px; top: 360px; width: 980px; height: 780px; opacity: 0; }
        #s4-svg { position: absolute; inset: 0; width: 980px; height: 780px; overflow: visible; }
        .tag { position: absolute; padding: 8px 16px; border-radius: 12px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 26px; white-space: nowrap; opacity: 0; }
        .card { position: absolute; left: 70px; right: 70px; top: 1200px; height: 400px; padding: 40px 44px; border-radius: 32px; background: #1c1a15; border: 4px solid #2e2b24; opacity: 0; }
        .ctag { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.1em; }
        .cmain { margin-top: 22px; font-family: "Archivo Black", sans-serif; font-size: 70px; line-height: 1.05; letter-spacing: -0.035em; color: #f5f1e6; }
        .csub { margin-top: 22px; font-family: "JetBrains Mono", monospace; font-size: 32px; line-height: 1.4; color: #cfc8b8; }
        #s4-disc { position: absolute; left: 80px; right: 80px; top: 1660px; font-family: "JetBrains Mono", monospace; font-size: 24px; color: #9d968a; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s4-ccx" data-start="0" data-duration="9.4" data-width="1080" data-height="1920">
        <div id="s4-label" class="label">COVERED CALL · AT EXPIRY</div>
        <div id="s4-ttl"><span class="w">Two</span> <span class="w y">outcomes.</span></div>
        <div id="s4-chart" data-layout-allow-overflow><svg id="s4-svg" viewBox="0 0 980 780"></svg></div>
        <div id="s4-cards"></div>
        <div id="s4-disc">Example prices from the Binance article · per share · not financial advice</div>
      </div>
      <script>
        (() => {
          const CFG = {"id": "s4-ccx", "dur": 9.4, "label": "COVERED CALL · AT EXPIRY", "title": "Two outcomes.", "lo": 85, "hi": 160, "grid": [100, 110, 150], "strike": 110, "strike_label": "STRIKE $110", "paths": [{"id": "a", "pts": [100, 104, 101, 107, 103, 106], "color": "#3ddc84", "draw": [0.9, 2.3], "end": "$106", "dim_at": 4.6}, {"id": "b", "pts": [100, 106, 112, 124, 138, 150], "color": "#f0b90b", "draw": [4.7, 8.4], "split": {"price": 110, "at": 5.5}, "end": "$150"}], "marks": [{"price": 110, "on": "b", "text": "SOLD AT $110", "at": 6.4, "color": "#f0b90b"}], "shades": [{"from": 110, "to": 150, "x0": "cross:b:110", "color": "240,185,11", "text": "+$40 you give up", "at": 8.45}], "lines": [], "cards": [{"at": 2.35, "tag": "IF IT STAYS BELOW $110", "main": "Keep the shares + $3", "sub": "The option expires without assignment.", "color": "#3ddc84"}, {"at": 6.3, "tag": "IF IT RISES ABOVE $110", "main": "You sell at $110 (+$3)", "sub": "", "color": "#f0b90b"}], "subs": [{"card": 1, "at": 8.5, "text": "Even if the stock hits $150."}]};
          const P = "s4", D = 9.4;
          const $ = (id) => document.getElementById(id);
          const NS = "http://www.w3.org/2000/svg";
          const svg = $(P + "-svg"), chart = $(P + "-chart");
          const X0 = 110, X1 = 900, Y0 = 720, Y1 = 40;
          const X = (f) => X0 + (X1 - X0) * f;
          const Y = (v) => Y0 - ((v - CFG.lo) / (CFG.hi - CFG.lo)) * (Y0 - Y1);
          const el = (tag, attrs, parent = svg) => { const e = document.createElementNS(NS, tag); for (const k in attrs) e.setAttribute(k, attrs[k]); parent.appendChild(e); return e; };
          const tag = (id, text, x, y, color, bg) => { const t = document.createElement("div"); t.className = "tag"; t.id = id; t.textContent = text; Object.assign(t.style, { left: x + "px", top: y + "px", color: color, background: bg }); chart.appendChild(t); return t; };
          // Grid and axis labels
          CFG.grid.forEach((v) => {
            el("line", { x1: X0, x2: X1, y1: Y(v), y2: Y(v), stroke: "#2e2b24", "stroke-width": 2 });
            const lb = el("text", { x: X0 - 18, y: Y(v) + 10, "text-anchor": "end", fill: "#9d968a", "font-family": "JetBrains Mono, monospace", "font-size": 28, "font-weight": 700 });
            lb.textContent = "$" + v;
          });
          el("line", { x1: X0, x2: X0, y1: Y1, y2: Y0, stroke: "#3a362e", "stroke-width": 3 });
          // Strike line
          el("line", { id: P + "-strike", x1: X0, x2: X1, y1: Y(CFG.strike), y2: Y(CFG.strike), stroke: "#f0b90b", "stroke-width": 4, "stroke-dasharray": "14 12", opacity: 0 });
          tag(P + "-strike-t", CFG.strike_label, X1 - 230, Y(CFG.strike) - 58, "#0c0b09", "#f0b90b");
          // Effective-cost and other reference lines
          CFG.lines.forEach((l, i) => {
            el("line", { id: `${P}-line-${i}`, x1: X0, x2: X1, y1: Y(l.price), y2: Y(l.price), stroke: l.color, "stroke-width": 4, "stroke-dasharray": "4 10", "stroke-linecap": "round", opacity: 0 });
            tag(`${P}-line-t-${i}`, l.text, X0 + 20, Y(l.price) + 12, "#0c0b09", l.color);
          });
          // Smooth price paths (Catmull-Rom to cubic Bezier)
          const paths = {};
          CFG.paths.forEach((pa) => {
            const pts = pa.pts.map((v, i) => [X(i / (pa.pts.length - 1)), Y(v)]);
            let d = `M${pts[0][0]} ${pts[0][1]}`;
            for (let i = 0; i < pts.length - 1; i++) {
              const p0 = pts[Math.max(0, i - 1)], p1 = pts[i], p2 = pts[i + 1], p3 = pts[Math.min(pts.length - 1, i + 2)];
              const c1 = [p1[0] + (p2[0] - p0[0]) / 6, p1[1] + (p2[1] - p0[1]) / 6], c2 = [p2[0] - (p3[0] - p1[0]) / 6, p2[1] - (p3[1] - p1[1]) / 6];
              d += ` C${c1[0]} ${c1[1]} ${c2[0]} ${c2[1]} ${p2[0]} ${p2[1]}`;
            }
            const path = el("path", { id: `${P}-p-${pa.id}`, d, fill: "none", stroke: pa.color, "stroke-width": 9, "stroke-linecap": "round", "stroke-linejoin": "round" });
            const len = path.getTotalLength();
            path.style.strokeDasharray = len; path.style.strokeDashoffset = len;
            const end = pts[pts.length - 1];
            el("circle", { id: `${P}-dot-${pa.id}`, cx: end[0], cy: end[1], r: 14, fill: pa.color, opacity: 0 });
            tag(`${P}-end-${pa.id}`, pa.end, end[0] - 60, end[1] + (pa.pts[pa.pts.length - 1] < pa.pts[0] ? 22 : -64), "#0c0b09", pa.color);
            paths[pa.id] = { path, len, pts };
          });
          el("circle", { id: P + "-start", cx: X(0), cy: Y(100), r: 14, fill: "#f5f1e6", opacity: 0 });
          tag(P + "-start-t", "$100 TODAY", X(0) + 14, Y(100) - 62, "#0c0b09", "#f5f1e6");
          // Length along a path where it first reaches a price
          function lenAt(id, price) {
            const { path, len } = paths[id];
            const target = Y(price), up = CFG.paths.find((q) => q.id === id).pts.slice(-1)[0] > 100;
            let lo = 0, hi = len;
            for (let k = 0; k < 40; k++) { const m = (lo + hi) / 2, y = path.getPointAtLength(m).y; if (up ? y > target : y < target) lo = m; else hi = m; }
            return hi;
          }
          // Marks on a path
          CFG.marks.forEach((m, i) => {
            const pt = paths[m.on].path.getPointAtLength(lenAt(m.on, m.price));
            el("circle", { id: `${P}-mk-${i}`, cx: pt.x, cy: pt.y, r: 18, fill: "#0c0b09", stroke: m.color, "stroke-width": 6, opacity: 0 });
            tag(`${P}-mk-t-${i}`, m.text, pt.x - 250, pt.y - 70, "#0c0b09", m.color);
          });
          // Shaded zones
          CFG.shades.forEach((s, i) => {
            let x0;
            if (typeof s.x0 === "string") { const [, id, pr] = s.x0.split(":"); x0 = paths[id].path.getPointAtLength(lenAt(id, Number(pr))).x; } else x0 = X(s.x0);
            const r = el("rect", { id: `${P}-sh-${i}`, x: x0, y: Y(s.to), width: X1 - x0, height: Y(s.from) - Y(s.to), fill: `rgba(${s.color},0.22)`, stroke: `rgba(${s.color},0.9)`, "stroke-width": 3, "stroke-dasharray": "8 8", opacity: 0 });
            svg.insertBefore(r, svg.firstChild);
            tag(`${P}-sh-t-${i}`, s.text, x0 - 30, (Y(s.to) + Y(s.from)) / 2 - 22, "#0c0b09", `rgb(${s.color})`);
          });
          // Outcome cards
          CFG.cards.forEach((c, i) => {
            const d = document.createElement("div");
            d.className = "card"; d.id = `${P}-card-${i}`; d.style.borderColor = c.color;
            d.innerHTML = `<div class="ctag"></div><div class="cmain"></div><div style="position:relative"><div class="csub" id="${P}-csub-${i}"></div><div class="csub" id="${P}-csub2-${i}" style="position:absolute;left:0;top:0;opacity:0"></div></div>`;
            d.querySelector(".ctag").textContent = c.tag; d.querySelector(".ctag").style.color = c.color;
            d.querySelector(".cmain").textContent = c.main;
            d.querySelector(".csub").textContent = c.sub;
            $(P + "-cards").appendChild(d);
          });

          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((w, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(w, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(w, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }
          tl.fromTo("#" + P + "-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.05);
          waterfall("#" + P + "-ttl", 0.1, 0.25);
          tl.fromTo("#" + P + "-chart", { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.15);
          tl.fromTo("#" + P + "-strike", { opacity: 0 }, { opacity: 1, duration: 0.3 }, 0.35);
          tl.fromTo("#" + P + "-strike-t", { opacity: 0, x: 30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.4);
          tl.fromTo(["#" + P + "-start", "#" + P + "-start-t"], { opacity: 0 }, { opacity: 1, duration: 0.25 }, 0.5);
          tl.fromTo("#" + P + "-disc", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 0.6);
          CFG.paths.forEach((pa) => {
            const P2 = `#${P}-p-${pa.id}`, len = paths[pa.id].len;
            if (pa.split) {
              const l1 = lenAt(pa.id, pa.split.price);
              tl.fromTo(P2, { strokeDashoffset: len }, { strokeDashoffset: len - l1, duration: pa.split.at - pa.draw[0], ease: "power1.inOut" }, pa.draw[0]);
              tl.to(P2, { strokeDashoffset: 0, duration: pa.draw[1] - 7.3, ease: "power1.inOut" }, 7.3);
            } else {
              tl.fromTo(P2, { strokeDashoffset: len }, { strokeDashoffset: 0, duration: pa.draw[1] - pa.draw[0], ease: "power1.inOut" }, pa.draw[0]);
            }
            tl.fromTo([`#${P}-dot-${pa.id}`, `#${P}-end-${pa.id}`], { opacity: 0, scale: 0.5 }, { opacity: 1, scale: 1, duration: 0.25, ease: "back.out(2)" }, pa.draw[1]);
            if (pa.dim_at) tl.to([P2, `#${P}-dot-${pa.id}`, `#${P}-end-${pa.id}`], { opacity: 0.18, duration: 0.3 }, pa.dim_at);
          });
          CFG.marks.forEach((m, i) => tl.fromTo([`#${P}-mk-${i}`, `#${P}-mk-t-${i}`], { opacity: 0, scale: 0.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "back.out(2.2)" }, m.at));
          CFG.lines.forEach((l, i) => tl.fromTo([`#${P}-line-${i}`, `#${P}-line-t-${i}`], { opacity: 0 }, { opacity: 1, duration: 0.35 }, l.at));
          CFG.shades.forEach((s, i) => tl.fromTo([`#${P}-sh-${i}`, `#${P}-sh-t-${i}`], { opacity: 0 }, { opacity: 1, duration: 0.35 }, s.at));
          CFG.cards.forEach((c, i) => {
            tl.fromTo(`#${P}-card-${i}`, { opacity: 0, y: 40 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, c.at);
            const next = CFG.cards[i + 1];
            if (next) tl.to(`#${P}-card-${i}`, { opacity: 0, y: -30, duration: 0.2, ease: "power3.in" }, next.at - 0.22);
          });
          CFG.subs.forEach((s) => {
            $(`${P}-csub2-${s.card}`).textContent = s.text;
            tl.to(`#${P}-csub-${s.card}`, { opacity: 0, duration: 0.15 }, s.at);
            tl.fromTo(`#${P}-csub2-${s.card}`, { opacity: 0, y: 12 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, s.at);
          });
          tl.to(["#" + P + "-label", "#" + P + "-ttl", "#" + P + "-chart", "#" + P + "-cards", "#" + P + "-disc"], { opacity: 0, y: -40, duration: 0.18, ease: "power3.in" }, D - 0.2);
          window.__timelines["s4-ccx"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
