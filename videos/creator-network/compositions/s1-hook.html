<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0b0b0a; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .blob { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(240, 185, 11, 0.30) 0%, rgba(240, 185, 11, 0.08) 45%, rgba(240, 185, 11, 0) 70%); }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }

        #s1-blob { left: -300px; top: 300px; width: 1400px; height: 1400px; }
        #s1-words { position: absolute; left: 90px; right: 90px; top: 420px; font-family: "Archivo Black", sans-serif; font-size: 200px; line-height: 0.95; letter-spacing: -0.045em; color: #f5f1e6; }
        #s1-words .ln { display: block; }
        .slam { display: inline-block; opacity: 0; will-change: transform; transform-origin: 0% 80%; }
        #s1-type { position: absolute; left: 90px; right: 90px; top: 1350px; font-family: "JetBrains Mono", monospace; font-size: 44px; line-height: 1.4; color: #d8d2c2; white-space: pre; }
        #s1-caret { display: inline-block; width: 22px; height: 48px; margin-left: 4px; vertical-align: -8px; background: #f0b90b; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s1-hook" data-start="0" data-duration="4.444" data-width="1080" data-height="1920">
        <div id="s1-blob" class="blob" data-layout-allow-overflow></div>
        <div id="s1-words" data-layout-allow-overlap>
          <span class="ln"><span class="slam" id="s1-w1" data-layout-allow-overlap>Better</span></span>
          <span class="ln"><span class="slam" id="s1-w2" data-layout-allow-overlap>late</span></span>
          <span class="ln"><span class="slam" id="s1-w3" data-layout-allow-overlap>than</span></span>
          <span class="ln"><span class="slam y" id="s1-w4" data-layout-allow-overlap>never.</span></span>
        </div>
        <div id="s1-type"><span id="s1-txt"></span><span id="s1-caret"></span></div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 108;
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s1-blob", { x: 0, y: 0, scale: 0.9 }, { x: 260, y: -160, scale: 1.1, duration: 8 * B, ease: "none" }, 0);
          ["#s1-w1", "#s1-w2", "#s1-w3", "#s1-w4"].forEach((id, i) => {
            const t = 0.05 + i * B;
            tl.fromTo(id, { opacity: 0, scale: 1.6, y: -30 }, { opacity: 1, scale: 1, y: 0, duration: 0.22, ease: "power4.out" }, t);
          });
          // Typewriter: text is a pure function of the proxy, so it is seek-safe
          const msg = "A month ago, I got a message…";
          const txt = document.getElementById("s1-txt");
          const p = { n: 0 };
          tl.set("#s1-caret", { opacity: 1 }, 4.4 * B);
          tl.fromTo(p, { n: 0 }, { n: msg.length, duration: 1.3, ease: "none", onUpdate: () => { txt.textContent = msg.slice(0, Math.round(p.n)); } }, 4.4 * B);
          tl.to("#s1-words, #s1-type", { opacity: 0, y: -50, duration: 0.2, ease: "power3.in" }, 8 * B - 0.22);
          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
