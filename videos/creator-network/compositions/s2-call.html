<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0b0b0a; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .blob { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(240, 185, 11, 0.30) 0%, rgba(240, 185, 11, 0.08) 45%, rgba(240, 185, 11, 0) 70%); }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }

        #s2-blob { right: -500px; top: 900px; width: 1400px; height: 1400px; }
        #s2-label { position: absolute; left: 90px; top: 250px; opacity: 0; }
        #s2-card { position: absolute; left: 70px; top: 330px; width: 940px; border-radius: 36px; overflow: hidden; border: 3px solid #2d2c27; box-shadow: 0 40px 100px rgba(0, 0, 0, 0.7); background: #000; will-change: transform; }
        #s2-img { display: block; width: 100%; height: auto; }
        #s2-hl { position: absolute; left: 8px; top: 768px; width: 922px; height: 110px; border: 6px solid #f0b90b; border-radius: 20px; box-shadow: 0 0 44px rgba(240, 185, 11, 0.55); opacity: 0; }
        #s2-foot { position: absolute; left: 90px; right: 90px; top: 1430px; font-family: "JetBrains Mono", monospace; font-size: 42px; line-height: 1.45; color: #d8d2c2; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s2-call" data-start="0" data-duration="4.444" data-width="1080" data-height="1920">
        <div id="s2-blob" class="blob" data-layout-allow-overflow></div>
        <div id="s2-label" class="label">THE CALL</div>
        <div id="s2-card">
          <img id="s2-img" src="assets/img/diana-post.png" alt="Post by @dianabinance inviting crypto and finance creators to join the Binance Creator Network" />
          <div id="s2-hl" data-layout-allow-overflow></div>
        </div>
        <div id="s2-foot">So I applied.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 108;
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s2-blob", { x: 0, y: 0 }, { x: -200, y: -240, duration: 8 * B, ease: "none" }, 0);
          tl.fromTo("#s2-label", { opacity: 0, x: -30 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.1);
          tl.fromTo("#s2-card", { opacity: 0, y: 160, rotation: -2 }, { opacity: 1, y: 0, rotation: 0, duration: 0.5, ease: "power3.out" }, 0.15);
          tl.to("#s2-card", { y: -30, duration: 8 * B - 0.8, ease: "sine.inOut" }, 0.65);
          tl.fromTo("#s2-hl", { opacity: 0, scale: 1.08 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 3 * B);
          tl.fromTo("#s2-foot", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 5 * B);
          tl.to("#s2-card, #s2-label, #s2-foot", { opacity: 0, y: -50, duration: 0.2, ease: "power3.in" }, 8 * B - 0.22);
          window.__timelines["s2-call"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
