<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0b0b0a; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .blob { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(240, 185, 11, 0.30) 0%, rgba(240, 185, 11, 0.08) 45%, rgba(240, 185, 11, 0) 70%); }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }

        #s5-cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
        #s5-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s5-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(11,11,10,0.96) 0%, rgba(11,11,10,0.82) 36%, rgba(11,11,10,0) 62%); }
        #s5-now { position: absolute; left: 90px; top: 1170px; opacity: 0; }
        #s5-tick { position: absolute; left: 90px; right: 60px; top: 1230px; height: 130px; overflow: hidden; }
        .tk { position: absolute; left: 0; top: 0; font-family: "Archivo Black", sans-serif; font-size: 84px; line-height: 130px; letter-spacing: -0.035em; color: #f5f1e6; white-space: nowrap; opacity: 0; will-change: transform; }
        #s5-end { position: absolute; left: 90px; right: 60px; top: 1400px; font-family: "Archivo Black", sans-serif; font-size: 86px; line-height: 1; letter-spacing: -0.04em; color: #f0b90b; white-space: nowrap; }
        #s5-handle { position: absolute; left: 90px; top: 1560px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 36px; color: #d8d2c2; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s5-now" data-start="0" data-duration="5.556" data-width="1080" data-height="1920">
        <div id="s5-cam" data-layout-allow-overflow>
          <video id="s5-video" class="clip" src="assets/video/desk.mp4" data-start="0" data-duration="5.556" data-track-index="0" muted playsinline></video>
        </div>
        <div id="s5-scrim"></div>
        <div id="s5-now" class="label">NOW</div>
        <div id="s5-tick" data-layout-allow-overflow data-layout-allow-occlusion>
          <div class="tk" id="s5-k1" data-layout-allow-occlusion data-layout-allow-overflow>Learning every day.</div>
          <div class="tk" id="s5-k2" data-layout-allow-occlusion data-layout-allow-overflow>Amazing creators.</div>
          <div class="tk" id="s5-k3" data-layout-allow-occlusion data-layout-allow-overflow>Growing.</div>
        </div>
        <div id="s5-end"><span class="w">Just</span> <span class="w">getting</span> <span class="w">started.</span></div>
        <div id="s5-handle">@Loreano_A · Binance Creator Network</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 108;
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s5-cam", { scale: 1.12 }, { scale: 1.02, duration: 10 * B, ease: "none" }, 0);
          tl.fromTo("#s5-now", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.1);
          // Ticker: each line slides up into the mask, holds 2 beats, slides out
          ["#s5-k1", "#s5-k2", "#s5-k3"].forEach((id, i) => {
            const t = 0.2 + i * 2 * B;
            tl.fromTo(id, { opacity: 1, yPercent: 100 }, { opacity: 1, yPercent: 0, duration: 0.25, ease: "power4.out", immediateRender: false }, t);
            if (i < 2) tl.to(id, { yPercent: -100, duration: 0.22, ease: "power3.in" }, t + 2 * B - 0.2);
          });
          waterfall("#s5-end", 6 * B, 0.3);
          tl.fromTo("#s5-handle", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 7.2 * B);
          window.__timelines["s5-now"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
