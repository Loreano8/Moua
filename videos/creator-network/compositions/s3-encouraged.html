<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0b0b0a; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .blob { position: absolute; border-radius: 50%; background: radial-gradient(circle, rgba(240, 185, 11, 0.30) 0%, rgba(240, 185, 11, 0.08) 45%, rgba(240, 185, 11, 0) 70%); }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }

        #s3-blob { left: -200px; top: 500px; width: 1500px; height: 1500px; }
        #s3-box { position: absolute; left: 90px; right: 90px; top: 620px; }
        #s3-a { font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 54px; color: #d8d2c2; opacity: 0; }
        #s3-role { margin-top: 30px; opacity: 0; }
        #s3-name { margin-top: 8px; font-family: "Archivo Black", sans-serif; font-size: 124px; line-height: 1; letter-spacing: -0.04em; color: #f5f1e6; white-space: nowrap; }
        #s3-thanks { margin-top: 50px; display: inline-block; padding: 18px 34px; border-radius: 999px; border: 4px solid #f0b90b; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 44px; color: #f0b90b; opacity: 0; will-change: transform; }
      </style>
      <div id="root" data-composition-id="s3-encouraged" data-start="0" data-duration="2.222" data-width="1080" data-height="1920">
        <div id="s3-blob" class="blob" data-layout-allow-overflow></div>
        <div id="s3-box">
          <div id="s3-a">Encouraged to apply by</div>
          <div id="s3-role" class="label">BINANCE ANGEL</div>
          <div id="s3-name"><span class="w">@RamadoneA</span></div>
          <div id="s3-thanks">Thank you 🙏</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 108;
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s3-blob", { scale: 0.8 }, { scale: 1.1, duration: 4 * B, ease: "none" }, 0);
          tl.fromTo("#s3-a", { opacity: 0, y: 24 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 0.05);
          tl.fromTo("#s3-role", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.4);
          waterfall("#s3-name", 0.55, 0.1);
          tl.fromTo("#s3-thanks", { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 2 * B);
          tl.to("#s3-box", { opacity: 0, y: -50, duration: 0.2, ease: "power3.in" }, 4 * B - 0.22);
          window.__timelines["s3-encouraged"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
