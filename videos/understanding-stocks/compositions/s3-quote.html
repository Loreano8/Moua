<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }
        .grid { position: absolute; inset: -120px; background-image: linear-gradient(rgba(240, 185, 11, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(240, 185, 11, 0.07) 2px, transparent 2px); background-size: 120px 120px; }

        #s3-label { position: absolute; left: 90px; top: 220px; opacity: 0; }
        #s3-ttl { position: absolute; left: 90px; right: 90px; top: 280px; font-family: "Archivo Black", sans-serif; font-size: 110px; line-height: 1; letter-spacing: -0.04em; color: #f5f1e6; }
        #s3-panel { position: absolute; left: 80px; right: 80px; top: 560px; padding: 56px 60px; border-radius: 36px; background: #15140f; border: 3px solid #2e2c24; font-family: "JetBrains Mono", monospace; color: #f5f1e6; opacity: 0; }
        #s3-head { position: relative; display: flex; align-items: flex-start; justify-content: space-between; padding: 16px 24px; margin: -16px -24px 0; border-radius: 18px; }
        #s3-name { font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 34px; color: #a39c8c; margin-top: 6px; }
        .qrow .v.neg { color: #f6465d; }
        #s3-tick { font-family: "Archivo Black", sans-serif; font-size: 110px; letter-spacing: -0.02em; }
        #s3-ex { margin-top: 24px; font-size: 26px; letter-spacing: 0.14em; color: #f0b90b; }
        .qrow { position: relative; display: flex; justify-content: space-between; align-items: baseline; margin-top: 30px; padding: 20px 24px; border-radius: 18px; font-size: 48px; }
        .qrow .k { color: #a39c8c; }
        .qrow .v { font-weight: 700; }
        .qhl { position: absolute; inset: 0; border: 5px solid #f0b90b; border-radius: 18px; opacity: 0; }
        .note { position: absolute; right: 80px; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 40px; color: #0c0b09; background: #f0b90b; padding: 16px 26px; border-radius: 14px; opacity: 0; will-change: transform; }
        #s3-foot { position: absolute; left: 90px; right: 90px; top: 1680px; font-family: "JetBrains Mono", monospace; font-size: 26px; color: #8f887a; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s3-quote" data-start="0" data-duration="6.818" data-width="1080" data-height="1920">
        <div id="s3-label" class="label">MODULE 3.1</div>
        <div id="s3-ttl"><span class="w">Now</span> <span class="w">I</span> <span class="w">can</span> <span class="w y">read</span> <span class="w y">this.</span></div>
        <div id="s3-panel">
          <div id="s3-head"><div><span id="s3-tick">NVDA</span><div id="s3-name">NVIDIA Corporation</div></div><span id="s3-ex">BINANCE STOCKS</span><div class="qhl" id="s3-h1"></div></div>
          <div class="qrow" id="s3-r2"><span class="k">LAST PRICE</span><span class="v">$227.21</span><div class="qhl" id="s3-h2"></div></div>
          <div class="qrow" id="s3-r3"><span class="k">CHANGE</span><span class="v neg">−0.72%</span><div class="qhl" id="s3-h3"></div></div>
          <div class="qrow" id="s3-r4"><span class="k">VOLUME</span><span class="v">$61.99M</span><div class="qhl" id="s3-h4"></div></div>
        </div>
        <div class="note" id="s3-n1" style="top: 1330px">Ticker: the stock’s short name</div>
        <div class="note" id="s3-n2" style="top: 1330px">Last price: the latest trade</div>
        <div class="note" id="s3-n3" style="top: 1330px">Change: how far the price moved</div>
        <div class="note" id="s3-n4" style="top: 1330px">Volume: how much was traded</div>
        <div id="s3-foot">Snapshot from Binance Stocks, Sep 30, 2026. Not financial advice.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 88;
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s3-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 0.05);
          waterfall("#s3-ttl", 0.15, 0.3);
          tl.fromTo("#s3-panel", { opacity: 0, y: 160 }, { opacity: 1, y: 0, duration: 0.45, ease: "power3.out" }, 0.3);
          tl.fromTo("#s3-foot", { opacity: 0 }, { opacity: 1, duration: 0.4 }, 1.2);
          [1, 2, 3, 4].forEach((i) => {
            const t = (1 + (i - 1) * 2) * B + 0.3;
            tl.fromTo("#s3-h" + i, { opacity: 0, scale: 1.05 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, t);
            tl.fromTo("#s3-n" + i, { opacity: 0, y: 30 }, { opacity: 1, y: 0, duration: 0.3, ease: "power3.out" }, t + 0.05);
            if (i < 4) {
              tl.to("#s3-h" + i, { opacity: 0, duration: 0.2 }, t + 2 * B - 0.15);
              tl.to("#s3-n" + i, { opacity: 0, y: -20, duration: 0.2 }, t + 2 * B - 0.15);
            }
          });
          tl.to("#s3-panel, #s3-ttl, #s3-label, #s3-n4, #s3-foot", { opacity: 0, y: -50, duration: 0.2, ease: "power3.in" }, 10 * B - 0.22);
          window.__timelines["s3-quote"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
