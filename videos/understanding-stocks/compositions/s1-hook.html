<!doctype html>

  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }
        .grid { position: absolute; inset: -120px; background-image: linear-gradient(rgba(240, 185, 11, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(240, 185, 11, 0.07) 2px, transparent 2px); background-size: 120px 120px; }

        #s1-cam { position: absolute; inset: 0; transform-origin: 50% 45%; will-change: transform; }
        #s1-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s1-scrim { position: absolute; inset: 0; background: linear-gradient(to top, rgba(12,11,9,0.96) 0%, rgba(12,11,9,0.82) 34%, rgba(12,11,9,0) 60%), linear-gradient(to bottom, rgba(12,11,9,0.7) 0%, rgba(12,11,9,0) 18%); }
        #s1-tape { position: absolute; left: 0; right: 0; top: 150px; height: 84px; background: #f0b90b; overflow: hidden; }
        #s1-tape-in { position: absolute; left: 0; top: 0; white-space: nowrap; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 40px; line-height: 84px; letter-spacing: 0.06em; color: #0c0b09; will-change: transform; }
        #s1-a { position: absolute; left: 80px; right: 80px; bottom: 470px; font-family: "Archivo Black", sans-serif; font-size: 104px; line-height: 1.0; letter-spacing: -0.035em; color: #f5f1e6; }
        #s1-b { position: absolute; left: 80px; right: 80px; bottom: 470px; font-family: "Archivo Black", sans-serif; font-size: 124px; line-height: 1.0; letter-spacing: -0.04em; color: #f0b90b; }
        #s1-chip { position: absolute; left: 80px; bottom: 360px; padding: 14px 26px; border-radius: 999px; border: 3px solid #f0b90b; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; color: #f5f1e6; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s1-hook" data-start="0" data-duration="5.455" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow>
          <video id="s1-video" class="clip" src="assets/video/pc.mp4" data-start="0" data-duration="5.455" data-playback-rate="0.85" data-track-index="0" muted playsinline></video>
        </div>
        <div id="s1-scrim"></div>
        <div id="s1-tape" data-layout-allow-overflow><div id="s1-tape-in" data-layout-allow-overflow>SHARES ▲ DIVIDENDS ▲ IPO ▲ BID ▲ ASK ▲ SPREAD ▲ VOLUME ▲ ETFs ▲ LIMIT ORDERS ▲ SHARES ▲ DIVIDENDS ▲ IPO ▲ BID ▲ ASK ▲ SPREAD ▲ VOLUME ▲ ETFs ▲ LIMIT ORDERS ▲ SHARES ▲ DIVIDENDS ▲ IPO ▲ BID ▲ ASK ▲ SPREAD ▲ VOLUME ▲ ETFs ▲ LIMIT ORDERS ▲ SHARES ▲ DIVIDENDS ▲ IPO ▲ BID ▲ ASK ▲ SPREAD ▲ VOLUME ▲ ETFs ▲ LIMIT ORDERS ▲ </div></div>
        <div id="s1-a"><span class="w">Stocks</span> <span class="w">are</span> <span class="w">the</span> <span class="w">language</span> <span class="w">the</span> <span class="w y">modern</span> <span class="w y">economy</span> <span class="w y">speaks.</span></div>
        <div id="s1-b"><span class="w">So</span> <span class="w">I</span> <span class="w">learned</span> <span class="w">to</span> <span class="w">read</span> <span class="w">it.</span></div>
        <div id="s1-chip">21 MIN · BINANCE ACADEMY</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 60 / 88;
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s1-cam", { scale: 1.12 }, { scale: 1.02, duration: 8 * B, ease: "none" }, 0);
          tl.fromTo("#s1-tape-in", { x: 0 }, { x: -900, duration: 8 * B, ease: "none" }, 0);
          waterfall("#s1-a", 0.15, 0.9);
          tl.to("#s1-a", { opacity: 0, y: -50, duration: 0.22, ease: "power3.in" }, 4 * B - 0.22);
          waterfall("#s1-b", 4 * B, 0.5);
          tl.fromTo("#s1-chip", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 5.5 * B);
          tl.to("#s1-b, #s1-chip", { opacity: 0, y: -40, duration: 0.2, ease: "power3.in" }, 8 * B - 0.22);
          window.__timelines["s1-hook"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
