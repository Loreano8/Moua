<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root {
          position: absolute;
          inset: 0;
          background: #0e1311;
        }
        #finale-cam {
          position: absolute;
          inset: 0;
          transform-origin: 50% 30%;
          will-change: transform;
        }
        #finale-video {
          position: absolute;
          inset: 0;
          width: 100%;
          height: 100%;
          object-fit: cover;
        }
        #finale-scrim {
          position: absolute;
          inset: 0;
          background:
            linear-gradient(to top, rgba(14, 19, 17, 0.94) 0%, rgba(14, 19, 17, 0.8) 34%, rgba(14, 19, 17, 0) 60%),
            linear-gradient(to bottom, rgba(14, 19, 17, 0.5) 0%, rgba(14, 19, 17, 0) 14%);
        }
        #finale-text {
          position: absolute;
          left: 80px;
          right: 80px;
          bottom: 420px;
          font-family: "Archivo Black", sans-serif;
          color: #f4f1e8;
        }
        .finale-beat {
          position: absolute;
          left: 0;
          right: 0;
          bottom: 0;
        }
        #finale-q {
          font-size: 150px;
          line-height: 0.98;
          letter-spacing: -0.035em;
        }
        #finale-q .y {
          color: #f0b90b;
        }
        #finale-a {
          font-size: 92px;
          line-height: 1.04;
          letter-spacing: -0.025em;
        }
        #finale-b {
          font-size: 112px;
          line-height: 1.02;
          letter-spacing: -0.03em;
        }
        #finale-b .y,
        #finale-a .y,
        #finale-c .y {
          color: #f0b90b;
        }
        #finale-c .c-line {
          white-space: nowrap;
        }
        #finale-c {
          font-size: 108px;
          line-height: 1.02;
          letter-spacing: -0.035em;
        }
        .w {
          display: inline-block;
          opacity: 0;
          will-change: transform;
        }
      </style>
      <div id="root" data-composition-id="finale" data-start="0" data-duration="12" data-width="1080" data-height="1920">
        <div id="finale-cam">
          <video
            id="finale-video"
            class="clip"
            src="assets/video/desk.mp4"
            data-start="0"
            data-duration="12"
            data-playback-rate="0.5"
            data-track-index="0"
            muted
            playsinline
          ></video>
        </div>
        <div id="finale-scrim"></div>
        <div id="finale-text">
          <div id="finale-q" class="finale-beat">
            <span class="w">Why</span> <span class="w y">Binance?</span>
          </div>
          <div id="finale-a" class="finale-beat">
            <span class="w">Since</span> <span class="w y">2020,</span> <span class="w">while</span>
            <span class="w">most</span> <span class="w">platforms</span> <span class="w">asked</span>
            <span class="w">for</span> <span class="w">complicated</span> <span class="w">verification,</span>
          </div>
          <div id="finale-b" class="finale-beat">
            <span class="w">Binance</span> <span class="w">just</span> <span class="w">asked</span>
            <span class="w">for</span> <span class="w">my</span> <span class="w y">national</span>
            <span class="w y">ID.</span>
          </div>
          <div id="finale-c" class="finale-beat">
            <div class="c-line"><span class="w">More</span> <span class="w">access.</span></div>
            <div class="c-line"><span class="w y">Less</span> <span class="w y">asked</span></div>
            <div class="c-line"><span class="w y">of</span> <span class="w y">you.</span></div>
          </div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const F = 1 / 60;
          // Footage: slow push-in
          tl.fromTo("#finale-cam", { scale: 1.04 }, { scale: 1.16, duration: 12, ease: "none" }, 0);

          // Waterfall entry, capped so a long line still lands as one wave
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }
          function liftOut(sel, t) {
            tl.to(sel, { y: -60, opacity: 0, duration: 0.22, ease: "power3.in" }, t);
          }
          waterfall("#finale-q", 0.35, 0.3);
          liftOut("#finale-q", 1.9);
          waterfall("#finale-a", 2.15, 1.0);
          liftOut("#finale-a", 4.9);
          waterfall("#finale-b", 5.15, 0.8);
          liftOut("#finale-b", 7.7);
          waterfall("#finale-c .c-line:nth-child(1)", 7.95, 0.2);
          waterfall("#finale-c .c-line:nth-child(2)", 8.65, 0.2);
          waterfall("#finale-c .c-line:nth-child(3)", 8.95, 0.2);
          window.__timelines["finale"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
