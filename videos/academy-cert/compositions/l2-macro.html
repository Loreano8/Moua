<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0c0b; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(240, 185, 11, 0.12) 3px, transparent 3.5px); background-size: 64px 64px; }
        .hdr { position: absolute; left: 90px; right: 90px; top: 160px; }
        .lesson { display: block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.16em; color: #f0b90b; opacity: 0; }
        .ttl { margin-top: 20px; font-family: "Archivo Black", sans-serif; font-size: 104px; line-height: 0.98; letter-spacing: -0.035em; color: #f4f1e8; }
        .sub { margin-top: 24px; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.3; color: #d9d4c6; opacity: 0; }

        #l2-flow { position: absolute; left: 90px; right: 90px; top: 790px; display: flex; flex-direction: column; gap: 18px; }
        .fl { display: flex; align-items: center; justify-content: space-between; height: 120px; padding: 0 44px; border-radius: 28px; background: #1a1a17; border: 3px solid #34332d; font-family: "Archivo Black", sans-serif; font-size: 56px; color: #f4f1e8; opacity: 0; will-change: transform; }
        .fl .up { color: #f0b90b; font-size: 60px; }
        .fl .down { color: #f6465d; font-size: 60px; }
      </style>
      <div id="root" data-composition-id="l2-macro" data-start="0" data-duration="5" data-width="1080" data-height="1350">
        <div id="l2-dots" class="dots" data-layout-allow-overflow></div>
        <div class="hdr" id="l2-hdr">
          <span class="lesson" id="l2-lesson">LESSON 02</span>
          <div class="ttl" id="l2-ttl"><span class="w">Macro</span> <span class="w y">moves</span> <span class="w y">crypto.</span></div>
          <div class="sub" id="l2-sub">When central banks raise rates, money flows out of risky assets.</div>
        </div>
        <div id="l2-flow">
          <div class="fl" id="l2-f1"><span>Interest rates</span><span class="up">▲</span></div>
          <div class="fl" id="l2-f2"><span>Risky assets</span><span class="down">▼</span></div>
          <div class="fl" id="l2-f3"><span>Crypto included</span><span class="down">▼</span></div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#l2-dots", { x: 0, y: 0 }, { x: 64, y: -64, duration: 5, ease: "none" }, 0);
          tl.fromTo("#l2-lesson", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.1);
          waterfall("#l2-ttl", 0.2, 0.4);
          tl.fromTo("#l2-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.8);
          ["#l2-f1", "#l2-f2", "#l2-f3"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 1.5 + i * 0.5);
          });
          tl.to("#l2-hdr, #l2-flow", { y: -40, opacity: 0, duration: 0.28, ease: "power3.in" }, 4.7);
          window.__timelines["l2-macro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
