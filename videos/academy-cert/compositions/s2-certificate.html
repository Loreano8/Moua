<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0c0b; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(240, 185, 11, 0.12) 3px, transparent 3.5px); background-size: 64px 64px; }

        #s2-glow { position: absolute; left: 50%; top: 640px; width: 1300px; height: 1000px; margin-left: -650px; margin-top: -500px; border-radius: 50%; background: radial-gradient(ellipse, rgba(240, 185, 11, 0.22) 0%, rgba(240, 185, 11, 0.06) 45%, rgba(240, 185, 11, 0) 70%); }
        #s2-top { position: absolute; left: 60px; right: 60px; top: 180px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 34px; letter-spacing: 0.14em; color: #f0b90b; opacity: 0; }
        #s2-stage { position: absolute; left: 60px; top: 270px; width: 960px; height: 670px; perspective: 1400px; }
        #s2-card { position: absolute; inset: 0; border-radius: 18px; overflow: hidden; box-shadow: 0 40px 90px rgba(0, 0, 0, 0.6); will-change: transform; }
        #s2-img { display: block; width: 100%; height: 100%; }
        #s2-sheen { position: absolute; top: -20%; left: 0; width: 260px; height: 140%; background: linear-gradient(90deg, rgba(255, 255, 255, 0) 0%, rgba(255, 255, 255, 0.55) 50%, rgba(255, 255, 255, 0) 100%); transform: rotate(18deg); opacity: 0; }
        #s2-hl { position: absolute; left: 244px; top: 494px; width: 470px; height: 76px; border: 6px solid #0c0c0b; border-radius: 16px; opacity: 0; }
        #s2-cap { position: absolute; left: 60px; right: 60px; top: 1010px; }
        #s2-big { font-family: "Archivo Black", sans-serif; font-size: 120px; line-height: 1; letter-spacing: -0.04em; color: #f0b90b; }
        #s2-sub .ln { display: block; white-space: nowrap; }
        #s2-sub { margin-top: 22px; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 42px; line-height: 1.3; color: #d9d4c6; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s2-certificate" data-start="0" data-duration="8" data-width="1080" data-height="1350">
        <div id="s2-dots" class="dots" data-layout-allow-overflow></div>
        <div id="s2-glow" data-layout-allow-overflow></div>
        <div id="s2-top">COURSE COMPLETED ✓</div>
        <div id="s2-stage">
          <div id="s2-card" data-layout-allow-overflow>
            <img id="s2-img" src="assets/img/certificate.jpg" alt="Binance Academy certificate of completion: From TradFi to Crypto" />
            <div id="s2-sheen" data-layout-allow-overflow></div>
            <div id="s2-hl"></div>
          </div>
        </div>
        <div id="s2-cap">
          <div id="s2-big"><span class="w">Certified.</span></div>
          <div id="s2-sub"><span class="ln">Know the roots,</span><span class="ln">read the markets.</span></div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s2-dots", { x: 0, y: 0 }, { x: -64, y: -64, duration: 8, ease: "none" }, 0);
          tl.fromTo("#s2-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" }, 0);
          tl.fromTo("#s2-card", { opacity: 0, y: 220, scale: 0.72, rotationX: 28 }, { opacity: 1, y: 0, scale: 1, rotationX: 0, duration: 0.8, ease: "power3.out" }, 0.05);
          tl.fromTo("#s2-top", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.6);
          tl.fromTo("#s2-sheen", { opacity: 1, x: -320 }, { opacity: 1, x: 1180, duration: 0.9, ease: "power2.inOut" }, 1.1);
          tl.fromTo("#s2-hl", { opacity: 0, scale: 1.12 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 2.5);
          waterfall("#s2-big", 3.0, 0.1);
          tl.fromTo("#s2-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.45, ease: "expo.out" }, 3.6);
          tl.fromTo("#s2-card", { scale: 1 }, { scale: 1.03, duration: 3.6, ease: "sine.inOut", immediateRender: false }, 4.3);
          window.__timelines["s2-certificate"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
