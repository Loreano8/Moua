<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0c0b; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(240, 185, 11, 0.12) 3px, transparent 3.5px); background-size: 64px 64px; }

        #s1-label { position: absolute; left: 90px; top: 190px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.16em; color: #f0b90b; opacity: 0; }
        #s1-ttl { position: absolute; left: 90px; right: 90px; top: 270px; font-family: "Archivo Black", sans-serif; font-size: 160px; line-height: 0.96; letter-spacing: -0.04em; color: #f4f1e8; }
        #s1-ttl .line { display: block; }
        #s1-svg { position: absolute; left: 0; top: 760px; width: 1080px; height: 420px; overflow: visible; }
        .node-label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.1em; fill: #f4f1e8; }
      </style>
      <div id="root" data-composition-id="s1-intro" data-start="0" data-duration="4.5" data-width="1080" data-height="1350">
        <div id="s1-dots" class="dots" data-layout-allow-overflow></div>
        <div id="s1-label">BINANCE ACADEMY · NEW COURSE</div>
        <div id="s1-ttl">
          <span class="line"><span class="w">From</span> <span class="w y">TradFi</span></span>
          <span class="line"><span class="w">to</span> <span class="w y">Crypto.</span></span>
        </div>
        <svg id="s1-svg" viewBox="0 0 1080 420">
          <path id="s1-path" d="M 210 150 C 330 150, 340 330, 470 330 S 600 70, 700 90 S 790 290, 870 270" fill="none" stroke="#f0b90b" stroke-width="8" stroke-linecap="round" />
          <g id="s1-n1">
            <circle cx="170" cy="150" r="78" fill="#161613" stroke="#f0b90b" stroke-width="6" />
            <text x="170" y="161" text-anchor="middle" class="node-label">TRADFI</text>
          </g>
          <g id="s1-n2">
            <circle cx="910" cy="270" r="78" fill="#f0b90b" stroke="#f0b90b" stroke-width="6" />
            <text x="910" y="281" text-anchor="middle" class="node-label" fill="#0c0c0b" style="fill: #0c0c0b">CRYPTO</text>
          </g>
        </svg>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s1-dots", { x: 0, y: 0 }, { x: 64, y: -64, duration: 4.5, ease: "none" }, 0);
          tl.fromTo("#s1-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.1);
          waterfall("#s1-ttl .line:nth-child(1)", 0.3, 0.2);
          waterfall("#s1-ttl .line:nth-child(2)", 0.75, 0.2);
          const path = document.getElementById("s1-path");
          const len = path.getTotalLength();
          tl.fromTo("#s1-n1", { opacity: 0, scale: 0, transformOrigin: "170px 150px" }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 1.3);
          tl.fromTo(path, { strokeDasharray: len, strokeDashoffset: len }, { strokeDashoffset: 0, duration: 1.3, ease: "power2.inOut" }, 1.6);
          tl.fromTo("#s1-n2", { opacity: 0, scale: 0, transformOrigin: "910px 270px" }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 2.8);
          tl.to("#s1-ttl, #s1-svg, #s1-label", { y: -40, opacity: 0, duration: 0.3, ease: "power3.in" }, 4.15);
          window.__timelines["s1-intro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
