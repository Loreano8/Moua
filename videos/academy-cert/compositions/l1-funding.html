<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0c0b; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(240, 185, 11, 0.12) 3px, transparent 3.5px); background-size: 64px 64px; }
        .hdr { position: absolute; left: 90px; right: 90px; top: 160px; }
        .lesson { display: block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.16em; color: #f0b90b; opacity: 0; }
        .ttl { margin-top: 20px; font-family: "Archivo Black", sans-serif; font-size: 104px; line-height: 0.98; letter-spacing: -0.035em; color: #f4f1e8; }
        .sub { margin-top: 24px; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.3; color: #d9d4c6; opacity: 0; }

        #l1-born { position: absolute; left: 90px; top: 760px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.14em; color: #a8a393; opacity: 0; }
        #l1-grid { position: absolute; left: 90px; right: 90px; top: 820px; display: grid; grid-template-columns: 1fr 1fr; gap: 24px; }
        .chip { height: 150px; border-radius: 28px; background: #1a1a17; border: 4px solid #f0b90b; display: flex; align-items: center; justify-content: center; font-family: "Archivo Black", sans-serif; font-size: 50px; letter-spacing: -0.01em; color: #f4f1e8; opacity: 0; will-change: transform; }
        .chip.hot { background: #f0b90b; color: #0c0c0b; }
      </style>
      <div id="root" data-composition-id="l1-funding" data-start="0" data-duration="5" data-width="1080" data-height="1350">
        <div id="l1-dots" class="dots" data-layout-allow-overflow></div>
        <div class="hdr" id="l1-hdr">
          <span class="lesson" id="l1-lesson">LESSON 01</span>
          <div class="ttl" id="l1-ttl"><span class="w">Funding</span> <span class="w">rates?</span> <span class="w">Not</span> <span class="w">a</span> <span class="w y">crypto</span> <span class="w y">invention.</span></div>
          <div class="sub" id="l1-sub">Neither are futures, options or swaps.</div>
        </div>
        <div id="l1-born">ALL BORN IN TRADFI</div>
        <div id="l1-grid">
          <div class="chip" id="l1-c1">Futures</div>
          <div class="chip" id="l1-c2">Options</div>
          <div class="chip" id="l1-c3">Swaps</div>
          <div class="chip hot" id="l1-c4">Funding rates</div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#l1-dots", { x: 0, y: 0 }, { x: 64, y: -64, duration: 5, ease: "none" }, 0);
          tl.fromTo("#l1-lesson", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.1);
          waterfall("#l1-ttl", 0.2, 0.4);
          tl.fromTo("#l1-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.8);
          tl.fromTo("#l1-born", { opacity: 0 }, { opacity: 1, duration: 0.4, ease: "power2.out" }, 1.4);
          ["#l1-c1", "#l1-c2", "#l1-c3", "#l1-c4"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.35, ease: "power3.out" }, 1.6 + i * 0.3);
          });
          tl.to("#l1-hdr, #l1-born, #l1-grid", { y: -40, opacity: 0, duration: 0.28, ease: "power3.in" }, 4.7);
          window.__timelines["l1-funding"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
