<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0c0b; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }
        .dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(240, 185, 11, 0.12) 3px, transparent 3.5px); background-size: 64px 64px; }
        .hdr { position: absolute; left: 90px; right: 90px; top: 160px; }
        .lesson { display: block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.16em; color: #f0b90b; opacity: 0; }
        .ttl { margin-top: 20px; font-family: "Archivo Black", sans-serif; font-size: 104px; line-height: 0.98; letter-spacing: -0.035em; color: #f4f1e8; }
        .sub { margin-top: 24px; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 40px; line-height: 1.3; color: #d9d4c6; opacity: 0; }

        #l3-list { position: absolute; left: 90px; right: 90px; top: 640px; display: flex; flex-direction: column; gap: 16px; }
        .it { display: flex; align-items: center; gap: 34px; height: 92px; font-family: "Archivo Black", sans-serif; font-size: 60px; color: #f4f1e8; opacity: 0; will-change: transform; }
        .box { position: relative; width: 72px; height: 72px; border-radius: 16px; border: 5px solid #f0b90b; flex: none; }
        .tick { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; background: #f0b90b; border-radius: 10px; color: #0c0c0b; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 48px; opacity: 0; will-change: transform; }
        #l3-foot { position: absolute; left: 90px; right: 90px; top: 1170px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.12em; color: #f0b90b; opacity: 0; }
      </style>
      <div id="root" data-composition-id="l3-checklist" data-start="0" data-duration="6" data-width="1080" data-height="1350">
        <div id="l3-dots" class="dots" data-layout-allow-overflow></div>
        <div class="hdr" id="l3-hdr">
          <span class="lesson" id="l3-lesson">LESSON 03</span>
          <div class="ttl" id="l3-ttl"><span class="w">A</span> <span class="w y">5-signal</span> <span class="w y">checklist.</span></div>
          <div class="sub" id="l3-sub">To read any market update.</div>
        </div>
        <div id="l3-list">
          <div class="it" id="l3-i0"><div class="box"><div class="tick" id="l3-t0">✓</div></div><span>Rates</span></div>
          <div class="it" id="l3-i1"><div class="box"><div class="tick" id="l3-t1">✓</div></div><span>Yields</span></div>
          <div class="it" id="l3-i2"><div class="box"><div class="tick" id="l3-t2">✓</div></div><span>The dollar</span></div>
          <div class="it" id="l3-i3"><div class="box"><div class="tick" id="l3-t3">✓</div></div><span>Sentiment</span></div>
          <div class="it" id="l3-i4"><div class="box"><div class="tick" id="l3-t4">✓</div></div><span>Inflation</span></div>
        </div>
        <div id="l3-foot">ONE MENTAL MAP, BOTH WORLDS.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#l3-dots", { x: 0, y: 0 }, { x: 64, y: -64, duration: 6, ease: "none" }, 0);
          tl.fromTo("#l3-lesson", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.1);
          waterfall("#l3-ttl", 0.2, 0.4);
          tl.fromTo("#l3-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.8);
          for (let i = 0; i < 5; i++) {
            tl.fromTo("#l3-i" + i, { opacity: 0, x: -40 }, { opacity: 1, x: 0, duration: 0.3, ease: "power3.out" }, 1.2 + i * 0.12);
            tl.fromTo("#l3-t" + i, { opacity: 0, scale: 0 }, { opacity: 1, scale: 1, duration: 0.25, ease: "power3.out" }, 2.0 + i * 0.4);
          }
          tl.fromTo("#l3-foot", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 4.3);
          tl.to("#l3-hdr, #l3-list, #l3-foot", { y: -40, opacity: 0, duration: 0.28, ease: "power3.in" }, 5.7);
          window.__timelines["l3-checklist"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
