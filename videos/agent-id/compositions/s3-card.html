<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #f0b90b; }
        #s3-glow { position: absolute; left: 140px; top: 120px; width: 800px; height: 800px; border-radius: 50%; background: radial-gradient(circle, rgba(240,185,11,0.35) 0%, rgba(240,185,11,0) 65%); opacity: 0; }
        #s3-card { position: absolute; left: 280px; top: 150px; width: 520px; height: 713px; opacity: 0; will-change: transform; }
        #s3-img { display: block; width: 100%; height: 100%; filter: drop-shadow(0 30px 50px rgba(0,0,0,0.6)); }
        #s3-shine-clip { position: absolute; left: 14px; top: 14px; right: 14px; bottom: 14px; overflow: hidden; border-radius: 18px; mix-blend-mode: screen; }
        #s3-shine { position: absolute; top: -20%; left: 0; width: 140px; height: 140%; background: linear-gradient(90deg, rgba(255,255,255,0), rgba(255,255,255,0.75), rgba(255,255,255,0)); transform-origin: 50% 50%; }
        #s3-label { position: absolute; left: 90px; top: 930px; opacity: 0; }
        .fact { position: absolute; left: 90px; right: 90px; height: 96px; display: flex; align-items: center; gap: 30px; opacity: 0; will-change: transform; }
        #s3-f0 { top: 990px; }
        #s3-f1 { top: 1100px; }
        #s3-f2 { top: 1210px; }
        #s3-f3 { top: 1320px; }
        .box { flex: none; width: 76px; height: 76px; border-radius: 18px; background: #f0b90b; color: #0c0b09; font-family: "Archivo Black", sans-serif; font-size: 46px; display: flex; align-items: center; justify-content: center; }
        .ft { font-family: "Archivo Black", sans-serif; font-size: 50px; letter-spacing: -0.025em; color: #f5f1e6; white-space: nowrap; }
        #s3-note { position: absolute; left: 90px; right: 90px; top: 1460px; font-family: "JetBrains Mono", monospace; font-size: 30px; line-height: 1.45; color: #cfc8b8; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s3-card" data-start="0" data-duration="4" data-width="1080" data-height="1920">
        <div id="s3-glow"></div>
        <div id="s3-card"><img id="s3-img" src="assets/img/agent-id-card.png" alt="Loreano's Binance Agent ID card: loreano, loreano.ai, one and only" /><div id="s3-shine-clip"><div id="s3-shine"></div></div></div>
        <div id="s3-label" class="label">ONE AND ONLY</div>
        <div class="fact" id="s3-f0"><div class="box">✓</div><div class="ft">One Agent ID per user</div></div>
        <div class="fact" id="s3-f1"><div class="box">✓</div><div class="ft">Non-transferable</div></div>
        <div class="fact" id="s3-f2"><div class="box">✓</div><div class="ft">Can't be renamed</div></div>
        <div class="fact" id="s3-f3"><div class="box">✓</div><div class="ft">Free to claim</div></div>
        <div id="s3-note">Claimed onchain. You only pay the BNB network fee.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 0.5;
          tl.fromTo("#s3-glow", { opacity: 0, scale: 0.7 }, { opacity: 1, scale: 1.1, duration: 1.0, ease: "power2.out" }, 0);
          tl.fromTo("#s3-card", { opacity: 0, rotationY: 200, scale: 0.6, transformPerspective: 1200 }, { opacity: 1, rotationY: 0, scale: 1, transformPerspective: 1200, duration: 0.9, ease: "expo.out" }, 0);
          tl.to("#s3-card", { y: -16, duration: 3, ease: "sine.inOut" }, 0.9);
          tl.fromTo("#s3-shine", { x: -200, rotation: 18 }, { x: 640, rotation: 18, duration: 0.7, ease: "power2.inOut" }, 0.9);
          tl.fromTo("#s3-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, 1.0);
          ["#s3-f0", "#s3-f1", "#s3-f2", "#s3-f3"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -100 }, { opacity: 1, x: 0, duration: 0.28, ease: "back.out(1.8)" }, 1.2 + i * B);
          });
          tl.fromTo("#s3-note", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.35, ease: "expo.out" }, 3.2);
          tl.to("#s3-card, #s3-glow, #s3-label, #s3-f0, #s3-f1, #s3-f2, #s3-f3, #s3-note", { opacity: 0, y: -40, duration: 0.2, ease: "power3.in" }, 3.78);
          window.__timelines["s3-card"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
