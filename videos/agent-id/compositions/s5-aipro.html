<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #f0b90b; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        #s5-label { position: absolute; left: 90px; top: 520px; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.18em; color: #0c0b09; opacity: 0; }
        #s5-ttl { position: absolute; left: 90px; right: 90px; top: 580px; font-family: "Archivo Black", sans-serif; font-size: 118px; line-height: 1.0; letter-spacing: -0.045em; color: #0c0b09; }
        #s5-ttl .ln { display: block; white-space: nowrap; }
        #s5-chips { position: absolute; left: 90px; right: 90px; top: 960px; display: flex; flex-wrap: wrap; gap: 24px; }
        .chip { padding: 22px 36px; border-radius: 999px; background: #0c0b09; color: #f0b90b; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 40px; opacity: 0; will-change: transform; }
        #s5-foot { position: absolute; left: 90px; right: 90px; top: 1120px; font-family: "Archivo Black", sans-serif; font-size: 50px; line-height: 1.1; letter-spacing: -0.02em; color: #0c0b09; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s5-aipro" data-start="0" data-duration="2" data-width="1080" data-height="1920">
        <div id="s5-label">IN BINANCE AI PRO</div>
        <div id="s5-ttl">
          <span class="ln"><span class="w">Just</span> <span class="w">ask,</span></span>
          <span class="ln"><span class="w">in</span> <span class="w">plain</span> <span class="w">words.</span></span>
        </div>
        <div id="s5-chips"><div class="chip" id="s5-c0">Check balance</div><div class="chip" id="s5-c1">Send</div><div class="chip" id="s5-c2">Swap</div></div>
        <div id="s5-foot">Within the daily limit you set.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.1, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.16 : 0.13, ease: "power4.out" }, t);
            });
          }
          tl.fromTo("#s5-label", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.25, ease: "expo.out" }, 0.05);
          waterfall("#s5-ttl", 0.1, 0.4);
          ["#s5-c0", "#s5-c1", "#s5-c2"].forEach((id, i) => tl.fromTo(id, { opacity: 0, scale: 0.6 }, { opacity: 1, scale: 1, duration: 0.22, ease: "back.out(2.2)" }, 0.65 + i * 0.15));
          tl.fromTo("#s5-foot", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 1.15);
          tl.to("#s5-ttl, #s5-label, #s5-chips, #s5-foot", { opacity: 0, y: -40, duration: 0.15, ease: "power3.in" }, 1.84);
          window.__timelines["s5-aipro"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
