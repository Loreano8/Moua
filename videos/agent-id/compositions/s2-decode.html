<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0c0b09; overflow: hidden; }
        .label { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 30px; letter-spacing: 0.16em; color: #f0b90b; }
        .grid { position: absolute; inset: -120px; background-image: linear-gradient(rgba(240, 185, 11, 0.07) 2px, transparent 2px), linear-gradient(90deg, rgba(240, 185, 11, 0.07) 2px, transparent 2px); background-size: 120px 120px; }
        #s2-scr { position: absolute; left: 80px; right: 80px; top: 250px; height: 220px; display: flex; align-items: center; justify-content: center; text-align: center; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 60px; line-height: 1.3; color: #e8e2d6; word-break: break-all; }
        #s2-name { position: absolute; left: 0; right: 0; top: 250px; height: 220px; display: flex; align-items: center; justify-content: center; font-family: "Archivo Black", sans-serif; font-size: 172px; letter-spacing: -0.045em; color: #f0b90b; opacity: 0; will-change: transform; }
        #s2-head { position: absolute; left: 80px; right: 80px; top: 560px; display: flex; gap: 30px; opacity: 0; }
        #s2-head div { flex: 1; text-align: center; }
        #s2-head .l { color: #b9b2a3; }
        .row { position: absolute; left: 80px; right: 80px; height: 200px; display: flex; gap: 30px; }
        #s2-r0 { top: 640px; }
        #s2-r1 { top: 870px; }
        #s2-r2 { top: 1100px; }
        .cell { flex: 1; border-radius: 26px; padding: 0 30px; display: flex; align-items: center; gap: 22px; opacity: 0; will-change: transform; }
        .bad { background: #1f1d18; border: 3px solid #3a362e; }
        .good { background: #f0b90b; }
        .ic { flex: none; width: 64px; height: 64px; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-family: "Archivo Black", sans-serif; font-size: 40px; }
        .bad .ic { background: #3a1d1a; color: #ff7a6b; }
        .good .ic { background: #0c0b09; color: #f0b90b; }
        .ct { font-family: "Archivo Black", sans-serif; font-size: 40px; line-height: 1.08; letter-spacing: -0.02em; }
        .bad .ct { color: #d9d2c3; }
        .good .ct { color: #0c0b09; }
        #s2-foot { position: absolute; left: 80px; right: 80px; top: 1370px; text-align: center; font-family: "JetBrains Mono", monospace; font-size: 32px; line-height: 1.45; color: #cfc8b8; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s2-decode" data-start="0" data-duration="6" data-width="1080" data-height="1920">
        <div id="s2-grid" class="grid" data-layout-allow-overflow></div>
        <div id="s2-scr">0x7f3A9c1E44b2d8F06aE91c5B3d7720Fe4C8a19D2</div>
        <div id="s2-name">loreano.ai</div>
        <div id="s2-head" class="label"><div class="l">0x7f3A…19D2</div><div>loreano.ai</div></div>
        <div class="row" id="s2-r0"><div class="cell bad" id="s2-b0"><div class="ic">✕</div><div class="ct">42 random characters</div></div><div class="cell good" id="s2-g0"><div class="ic">✓</div><div class="ct">One name you choose</div></div></div>
        <div class="row" id="s2-r1"><div class="cell bad" id="s2-b1"><div class="ic">✕</div><div class="ct">Says nothing about you</div></div><div class="cell good" id="s2-g1"><div class="ic">✓</div><div class="ct">Represents your agent onchain</div></div></div>
        <div class="row" id="s2-r2"><div class="cell bad" id="s2-b2"><div class="ic">✕</div><div class="ct">Hard to read out loud</div></div><div class="cell good" id="s2-g2"><div class="ic">✓</div><div class="ct">Easy to say and share</div></div></div>
        <div id="s2-foot">Underneath, it still points to a real wallet address.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          const B = 0.5;
          // Deterministic scramble: the address shrinks into the name
          const HEX = "0123456789abcdefABCDEF", FROM = 42, TO = "loreano.ai";
          let seed = 7;
          const rnd = () => { seed = (seed * 1103515245 + 12345) & 0x7fffffff; return seed; };
          const steps = 16;
          for (let s = 1; s <= steps; s++) {
            const len = Math.round(FROM + (TO.length - FROM) * (s / steps));
            let str = "";
            for (let i = 0; i < len; i++) str += s > steps - 4 && i < Math.floor(TO.length * (s - (steps - 4)) / 4) ? TO[i] : HEX[rnd() % HEX.length];
            tl.set("#s2-scr", { textContent: str }, 0.1 + s * 0.05);
          }
          tl.set("#s2-scr", { opacity: 0 }, 0.95);
          tl.fromTo("#s2-name", { opacity: 0, scale: 1.4 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power4.out" }, 0.95);
          tl.fromTo("#s2-grid", { y: 0 }, { y: -120, duration: 6, ease: "none" }, 0);
          tl.fromTo("#s2-head", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.3, ease: "expo.out" }, 1.4);
          [0, 1, 2].forEach((i) => {
            const t = 1.6 + i * 2 * B;
            tl.fromTo("#s2-b" + i, { opacity: 0, x: -80 }, { opacity: 1, x: 0, duration: 0.3, ease: "expo.out" }, t);
            tl.fromTo("#s2-g" + i, { opacity: 0, x: 80, scale: 0.9 }, { opacity: 1, x: 0, scale: 1, duration: 0.35, ease: "back.out(1.8)" }, t + B);
          });
          tl.fromTo("#s2-foot", { opacity: 0, y: 16 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 4.8);
          tl.to("#s2-name, #s2-head, #s2-r0, #s2-r1, #s2-r2, #s2-foot", { opacity: 0, y: -40, duration: 0.2, ease: "power3.in" }, 5.75);
          window.__timelines["s2-decode"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
