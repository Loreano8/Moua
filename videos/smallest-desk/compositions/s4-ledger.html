<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0e1311; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }

        .hdr { position: absolute; left: 80px; right: 80px; top: 190px; }
        .step { display: block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.16em; color: #f0b90b; opacity: 0; }
        .ttl { margin-top: 18px; font-family: "Archivo Black", sans-serif; font-size: 112px; line-height: 0.98; letter-spacing: -0.035em; color: #f4f1e8; }
        .sub { margin-top: 16px; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 44px; color: #c9c3b4; opacity: 0; }
        .dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(240, 185, 11, 0.12) 3px, transparent 3.5px); background-size: 64px 64px; }

        #s4-card { position: absolute; left: 80px; right: 80px; top: 560px; padding: 44px 50px; border-radius: 40px; background: #18201d; border: 3px solid #2c3632; font-family: "JetBrains Mono", monospace; color: #f4f1e8; }
        .row { display: flex; justify-content: space-between; font-size: 40px; line-height: 1.9; opacity: 0; will-change: transform; }
        .row .d { color: #a9b3ad; }
        .row .k { color: #2ebd85; font-weight: 700; }
        #s4-rule { height: 3px; margin: 18px 0; background: #3a4541; transform-origin: 0% 50%; }
        .row.sum { font-weight: 700; }
        #s4-big { position: absolute; left: 80px; right: 80px; top: 1250px; font-family: "Archivo Black", sans-serif; font-size: 230px; line-height: 1; letter-spacing: -0.04em; color: #2ebd85; font-variant-numeric: tabular-nums; opacity: 0; will-change: transform; transform-origin: 0% 50%; }
        #s4-note { position: absolute; left: 80px; right: 80px; top: 1500px; font-family: "JetBrains Mono", monospace; font-size: 28px; line-height: 1.4; color: #a9b3ad; opacity: 0; }
      </style>
      <div id="root" data-composition-id="s4-ledger" data-start="0" data-duration="7" data-width="1080" data-height="1920">
        <div id="s4-dots" class="dots" data-layout-allow-overflow></div>
        <div class="hdr">
          <span class="step" id="s4-step">STEP 3</span>
          <div class="ttl" id="s4-ttl"><span class="w">I</span> <span class="w y">stick</span> <span class="w y">to</span> <span class="w y">the</span> <span class="w y">plan.</span></div>
          <div class="sub" id="s4-sub">My real BNB DCA, pulled from Binance</div>
        </div>
        <div id="s4-card">
          <div class="row" id="s4-r1"><span class="d">AUG 27</span><span class="k">BUY BNB</span><span>$706.48</span></div>
          <div class="row" id="s4-r2"><span class="d">AUG 28</span><span class="k">BUY BNB</span><span>$704.19</span></div>
          <div class="row" id="s4-r3"><span class="d">SEP 04</span><span class="k">BUY BNB</span><span>$725.22</span></div>
          <div id="s4-rule"></div>
          <div class="row sum" id="s4-r4"><span>AVG COST</span><span>$711.30</span></div>
          <div class="row sum" id="s4-r5"><span>BNB · SEP 26</span><span>$774.12</span></div>
        </div>
        <div id="s4-big">+0.0%</div>
        <div id="s4-note">Small, regular buys. Real data. Not financial advice.</div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s4-dots", { x: 0, y: 0 }, { x: 64, y: -64, duration: 7, ease: "none" }, 0);
          tl.fromTo("#s4-step", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.1);
          waterfall("#s4-ttl", 0.2, 0.3);
          tl.fromTo("#s4-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.55);
          ["#s4-r1", "#s4-r2", "#s4-r3"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -50 }, { opacity: 1, x: 0, duration: 0.35, ease: "power3.out" }, 0.7 + i * 0.4);
          });
          tl.fromTo("#s4-rule", { scaleX: 0 }, { scaleX: 1, duration: 0.4, ease: "power2.out" }, 1.95);
          tl.fromTo("#s4-r4", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.2);
          tl.fromTo("#s4-r5", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.35, ease: "power3.out" }, 2.6);
          const big = document.getElementById("s4-big");
          const p = { v: 0 };
          tl.fromTo("#s4-big", { opacity: 0, scale: 0.8 }, { opacity: 1, scale: 1, duration: 0.4, ease: "power3.out" }, 3.2);
          tl.fromTo(p, { v: 0 }, { v: 8.8, duration: 1.0, ease: "power2.out", onUpdate: () => { big.textContent = "+" + p.v.toFixed(1) + "%"; } }, 3.2);
          tl.fromTo("#s4-note", { opacity: 0 }, { opacity: 1, duration: 0.5, ease: "power2.out" }, 4.5);
          window.__timelines["s4-ledger"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
