<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0e1311; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }

        #s1-cam { position: absolute; inset: 0; transform-origin: 50% 50%; will-change: transform; }
        #s1-video { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
        #s1-scrim { position: absolute; inset: 0; background:
          linear-gradient(to bottom, rgba(14,19,17,0.9) 0%, rgba(14,19,17,0.6) 26%, rgba(14,19,17,0) 40%),
          linear-gradient(to top, rgba(14,19,17,0.95) 0%, rgba(14,19,17,0.75) 30%, rgba(14,19,17,0) 52%); }
        #s1-ttl { position: absolute; left: 80px; right: 80px; top: 165px; font-family: "Archivo Black", sans-serif; font-size: 92px; line-height: 0.98; letter-spacing: -0.035em; color: #f4f1e8; }
        #s1-tags { position: absolute; left: 80px; right: 80px; bottom: 360px; display: flex; flex-direction: column; gap: 22px; }
        .tag { display: flex; align-items: baseline; gap: 26px; padding: 26px 34px; border-radius: 28px; background: rgba(24, 32, 29, 0.92); border: 3px solid #2c3632; opacity: 0; will-change: transform; }
        .tag b { font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 28px; letter-spacing: 0.1em; color: #f0b90b; white-space: nowrap; }
        .tag span { font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 42px; color: #f4f1e8; }
      </style>
      <div id="root" data-composition-id="s1-desk" data-start="0" data-duration="5.5" data-width="1080" data-height="1920">
        <div id="s1-cam" data-layout-allow-overflow>
          <video id="s1-video" class="clip" src="assets/video/desk.mp4" data-start="0" data-duration="5.5" data-track-index="0" muted playsinline></video>
        </div>
        <div id="s1-scrim"></div>
        <div id="s1-ttl"><span class="w">The</span> <span class="w">world’s</span> <span class="w y">smallest</span> <span class="w">trading</span> <span class="w">desk.</span></div>
        <div id="s1-tags">
          <div class="tag" id="s1-t1"><b>HEAD TRADER</b><span>Me</span></div>
          <div class="tag" id="s1-t2"><b>QUICK IDEAS</b><span>Binance AI</span></div>
          <div class="tag" id="s1-t3"><b>DEEP CHECKS</b><span>Claude + live Binance data</span></div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s1-cam", { scale: 1.08, y: 60 }, { scale: 1.14, y: 60, duration: 5.5, ease: "none" }, 0);
          waterfall("#s1-ttl", 0.2, 0.5);
          ["#s1-t1", "#s1-t2", "#s1-t3"].forEach((id, i) => {
            tl.fromTo(id, { opacity: 0, x: -60 }, { opacity: 1, x: 0, duration: 0.4, ease: "power3.out" }, 1.6 + i * 0.7);
          });
          window.__timelines["s1-desk"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
