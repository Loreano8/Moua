<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
  </head>
  <body>
    <template>
      <style>
        #root { position: absolute; inset: 0; background: #0e1311; overflow: hidden; }
        .w { display: inline-block; opacity: 0; will-change: transform; }
        .y { color: #f0b90b; }

        .hdr { position: absolute; left: 80px; right: 80px; top: 190px; }
        .step { display: block; font-family: "JetBrains Mono", monospace; font-weight: 700; font-size: 32px; letter-spacing: 0.16em; color: #f0b90b; opacity: 0; }
        .ttl { margin-top: 18px; font-family: "Archivo Black", sans-serif; font-size: 112px; line-height: 0.98; letter-spacing: -0.035em; color: #f4f1e8; }
        .sub { margin-top: 16px; font-family: "Montserrat", sans-serif; font-weight: 700; font-size: 44px; color: #c9c3b4; opacity: 0; }
        .dots { position: absolute; inset: -80px; background-image: radial-gradient(rgba(240, 185, 11, 0.12) 3px, transparent 3.5px); background-size: 64px 64px; }

        #s2-card { position: absolute; left: 180px; top: 560px; width: 720px; border-radius: 44px; overflow: hidden; border: 4px solid #2c3632; will-change: transform; }
        #s2-img { display: block; width: 100%; height: auto; }
        .hl { position: absolute; left: 14px; right: 14px; border: 6px solid #f0b90b; border-radius: 26px; opacity: 0; will-change: transform; }
        #s2-hl1 { top: 118px; height: 176px; }
        #s2-hl2 { top: 818px; height: 236px; }
      </style>
      <div id="root" data-composition-id="s2-binance-ai" data-start="0" data-duration="6" data-width="1080" data-height="1920">
        <div id="s2-dots" class="dots" data-layout-allow-overflow></div>
        <div class="hdr">
          <span class="step" id="s2-step">STEP 1</span>
          <div class="ttl" id="s2-ttl"><span class="w">Quick</span> <span class="w y">ideas.</span></div>
          <div class="sub" id="s2-sub">Binance AI, straight from the app</div>
        </div>
        <div id="s2-card">
          <img id="s2-img" src="assets/img/binance-ai.png" alt="Binance AI answering: best 3 cryptos to DCA in 2026 for a beginner" />
          <div class="hl" id="s2-hl1"></div>
          <div class="hl" id="s2-hl2"></div>
        </div>
      </div>
      <script>
        (() => {
          const tl = gsap.timeline({ paused: true });
          function waterfall(sel, t0, maxSpan) {
            const words = gsap.utils.toArray(sel + " .w");
            const step = Math.min(0.13, maxSpan / words.length);
            words.forEach((el, i) => {
              const heavy = i === 0 || i === words.length - 1;
              const t = t0 + i * step;
              tl.set(el, { opacity: 1, y: heavy ? 80 : 45 }, t);
              tl.to(el, { y: 0, duration: heavy ? 0.18 : 0.15, ease: "power4.out" }, t);
            });
          }

          tl.fromTo("#s2-dots", { x: 0, y: 0 }, { x: 64, y: -64, duration: 6, ease: "none" }, 0);
          tl.fromTo("#s2-step", { opacity: 0, x: -24 }, { opacity: 1, x: 0, duration: 0.35, ease: "expo.out" }, 0.1);
          waterfall("#s2-ttl", 0.2, 0.3);
          tl.fromTo("#s2-sub", { opacity: 0, y: 20 }, { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" }, 0.55);
          tl.fromTo("#s2-card", { opacity: 0, y: 140 }, { opacity: 1, y: 0, duration: 0.55, ease: "power3.out" }, 0.45);
          tl.fromTo("#s2-hl1", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 1.4);
          tl.to("#s2-hl1", { opacity: 0, duration: 0.25, ease: "power2.in" }, 3.0);
          tl.fromTo("#s2-hl2", { opacity: 0, scale: 1.06 }, { opacity: 1, scale: 1, duration: 0.3, ease: "power3.out" }, 3.2);
          tl.to("#s2-card", { y: -40, duration: 2.5, ease: "sine.inOut" }, 3.2);
          window.__timelines["s2-binance-ai"] = tl;
        })();
      </script>
    </template>
  </body>
</html>
